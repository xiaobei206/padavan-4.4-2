name: XY-C1 Firmware Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xy-c1-firmware-validation.yml"
      - "Makefile"
      - "trunk/Makefile"
      - "trunk/user/Makefile"
      - "trunk/libs/Makefile"
      - "trunk/user/skipdbv2/Makefile"
      - "trunk/user/skipdbv2/skipdbv2/**"
      - "trunk/configs/templates/XY-C1.config"
      - "trunk/configs/boards/XY-C1/**"
      - "trunk/linux-4.4.x/arch/mips/boot/dts/ralink/xy-c1.dts"
      - "trunk/linux-4.4.x/drivers/gpio/gpio-button-hotplug.c"
      - "trunk/linux-4.4.x/drivers/gpio/Makefile"
      - "trunk/user/rc/src/gpio_btn.c"
      - "trunk/user/rc/src/services.c"
  pull_request:
    paths:
      - ".github/workflows/xy-c1-firmware-validation.yml"
      - "Makefile"
      - "trunk/Makefile"
      - "trunk/user/Makefile"
      - "trunk/libs/Makefile"
      - "trunk/user/skipdbv2/Makefile"
      - "trunk/user/skipdbv2/skipdbv2/**"
      - "trunk/configs/templates/XY-C1.config"
      - "trunk/configs/boards/XY-C1/**"
      - "trunk/linux-4.4.x/arch/mips/boot/dts/ralink/xy-c1.dts"
      - "trunk/linux-4.4.x/drivers/gpio/gpio-button-hotplug.c"
      - "trunk/linux-4.4.x/drivers/gpio/Makefile"
      - "trunk/user/rc/src/gpio_btn.c"
      - "trunk/user/rc/src/services.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Cross-build XY-C1 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: hendrikmuhs/ccache-action@main
        with:
          key: XY-C1-mipsel-linux-musl

      - uses: actions/setup-go@main
        with:
          go-version: '1.23.x'
          check-latest: true
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext ccache \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev

      - name: Build XY-C1
        run: |
          set -e
          make XY-C1 TOOLCHAIN=mipsel-linux-musl

      - name: Verify TRX output
        run: |
          set -e
          shopt -s nullglob
          images=(trunk/images/*.trx)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "ERROR: XY-C1 build produced no .trx image."
            find trunk/images -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi
          for image in "${images[@]}"; do
            test -s "$image"
            ls -lh "$image"
            file "$image"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: XY-C1-firmware-${{ github.sha }}
          path: trunk/images/*.trx
          if-no-files-found: error
          retention-days: 7
