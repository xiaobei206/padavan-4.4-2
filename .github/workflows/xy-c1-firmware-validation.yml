name: XY-C1 Firmware Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xy-c1-firmware-validation.yml"
      - "Makefile"
      - "trunk/Makefile"
      - "trunk/user/Makefile"
      - "trunk/libs/Makefile"
      - "trunk/libs/liblzo/**"
      - "trunk/include/cmake.mk"
      - "trunk/user/skipdbv2/Makefile"
      - "trunk/user/cflags.mk"
      - "trunk/user/skipdbv2/skipdbv2/**"
      - "trunk/user/httpd/src/**"
      - "trunk/configs/templates/XY-C1.config"
      - "trunk/configs/boards/XY-C1/**"
      - "trunk/linux-4.4.x/arch/mips/boot/dts/ralink/xy-c1.dts"
      - "trunk/linux-4.4.x/drivers/gpio/gpio-button-hotplug.c"
      - "trunk/linux-4.4.x/drivers/gpio/Makefile"
      - "trunk/user/rc/src/gpio_btn.c"
      - "trunk/user/rc/src/services.c"
  pull_request:
    paths:
      - ".github/workflows/xy-c1-firmware-validation.yml"
      - "Makefile"
      - "trunk/Makefile"
      - "trunk/user/Makefile"
      - "trunk/libs/Makefile"
      - "trunk/libs/liblzo/**"
      - "trunk/include/cmake.mk"
      - "trunk/user/skipdbv2/Makefile"
      - "trunk/user/cflags.mk"
      - "trunk/user/skipdbv2/skipdbv2/**"
      - "trunk/user/httpd/src/**"
      - "trunk/configs/templates/XY-C1.config"
      - "trunk/configs/boards/XY-C1/**"
      - "trunk/linux-4.4.x/arch/mips/boot/dts/ralink/xy-c1.dts"
      - "trunk/linux-4.4.x/drivers/gpio/gpio-button-hotplug.c"
      - "trunk/linux-4.4.x/drivers/gpio/Makefile"
      - "trunk/user/rc/src/gpio_btn.c"
      - "trunk/user/rc/src/services.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Cross-build XY-C1 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: XY-C1-mipsel-linux-musl

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.x'
          check-latest: true
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext ccache \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev

          # Older vendored release tarballs hard-code versioned Autotools
          # helpers. ubuntu-latest may provide only a newer versioned name.
          for tool in aclocal automake; do
            tool_path="$(command -v "$tool")"
            for version in 1.8 1.16; do
              versioned_tool="${tool}-${version}"
              versioned_path="$(command -v "$versioned_tool" 2>/dev/null || true)"
              # command -v can report a dangling versioned symlink as present.
              # Test executability and repair the shim when the target is broken.
              if [ -z "$versioned_path" ] || [ ! -x "$versioned_path" ]; then
                sudo ln -sfn "$tool_path" "/usr/local/bin/$versioned_tool"
              fi
            done
          done

      - name: Build XY-C1
        run: |
          set -e
          make XY-C1 TOOLCHAIN=mipsel-linux-musl

      - name: Verify TRX output
        run: |
          set -e
          shopt -s nullglob
          images=(trunk/images/*.trx)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "ERROR: XY-C1 build produced no .trx image."
            find trunk/images -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi
          for image in "${images[@]}"; do
            test -s "$image"
            ls -lh "$image"
            file "$image"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: XY-C1-firmware-${{ github.sha }}
          path: trunk/images/*.trx
          if-no-files-found: error
          retention-days: 7
