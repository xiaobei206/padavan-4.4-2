name: Build Firmware

on:
  watch:
    types: [started]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    strategy:
      fail-fast: false

      matrix:
        target: [XY-C1]
        toolchain: [mipsel-linux-musl]

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 1

      - uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}

      - uses: actions/setup-go@main
        with:
          go-version: '1.23.x'
          check-latest: true
          cache: false

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext ccache \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev

          echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Set Firmware Version
        env:
          CUSTOM_VERSION: 4.4_$(git rev-parse --short=7 HEAD)_$(TZ='Asia/Shanghai' date +%y%m%d)
        run: |
          GIT_REV=$(git rev-parse --short=7 HEAD)
          SHORT_DATE=$(TZ='Asia/Shanghai' date +%y%m%d)

          echo "========================================"
          echo "Git Commit       : ${GIT_REV}"
          echo "Build Date       : ${SHORT_DATE}"
          echo "Firmware Version : ${CUSTOM_VERSION}"
          echo "========================================"

          cat > trunk/user/rc/src/custom_fw_version.h <<EOF
          #ifndef CUSTOM_FW_VERSION_H
          #define CUSTOM_FW_VERSION_H
          #define CUSTOM_FW_VERSION "${CUSTOM_VERSION}"
          #endif
          EOF

          echo
          echo "=== Generated custom_fw_version.h ==="
          cat trunk/user/rc/src/custom_fw_version.h

          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path("trunk/user/rc/src/common_ex.c")
          text = path.read_text()

          include_line = '#include "custom_fw_version.h"'

          if include_line not in text:
              marker = '#include "rc.h"'

              if marker not in text:
                  raise SystemExit('ERROR: #include "rc.h" not found in common_ex.c')

              text = text.replace(
                  marker,
                  marker + '\n' + include_line,
                  1
              )

          start_marker = '#if defined(FWBLDSTR)'
          end_marker = '#endif'

          start = text.find(start_marker)

          if start != -1:
              second_start = text.find('#if defined(FWREVSTR)', start)

              if second_start == -1:
                  raise SystemExit(
                      'ERROR: FWBLDSTR block found, but FWREVSTR block was not found.'
                  )

              end = text.find(
                  end_marker,
                  text.find(end_marker, second_start) + len(end_marker)
              )

              if end == -1:
                  raise SystemExit(
                      'ERROR: Could not locate end of firmware version block.'
                  )

              end += len(end_marker)

              new_block = '''#ifdef CUSTOM_FW_VERSION
              snprintf(fwver_sub, sizeof(fwver_sub), "%s", CUSTOM_FW_VERSION);
              #endif'''

              text = text[:start] + new_block + text[end:]

          elif '#ifdef CUSTOM_FW_VERSION' not in text:
              raise SystemExit(
                  'ERROR: Neither original FWBLDSTR/FWREVSTR block nor CUSTOM_FW_VERSION block was found.'
              )

          path.write_text(text)

          print("common_ex.c patched successfully.")
          print("CUSTOM_FW_VERSION =", os.environ["CUSTOM_VERSION"])
          PY

          echo
          echo "=== Verify custom version code ==="
          grep -n -A6 -B3 "CUSTOM_FW_VERSION" trunk/user/rc/src/common_ex.c

      - name: Build Firmware
        run: |
          make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain }}

      - name: Verify Firmware Version
        env:
          CUSTOM_VERSION: 4.4_$(git rev-parse --short=7 HEAD)_$(TZ='Asia/Shanghai' date +%y%m%d)
        run: |
          echo "========================================"
          echo "Expected Firmware Version: ${CUSTOM_VERSION}"
          echo "========================================"

          if [ ! -f trunk/user/rc/src/rc ]; then
            echo "ERROR: trunk/user/rc/src/rc was not found."
            exit 1
          fi

          echo "Checking rc binary..."

          if strings trunk/user/rc/src/rc | grep -F "${CUSTOM_VERSION}" >/dev/null 2>&1; then
            echo "SUCCESS: ${CUSTOM_VERSION} is embedded in rc."
          else
            echo "ERROR: ${CUSTOM_VERSION} was NOT found in rc."
            echo
            echo "Firmware version verification FAILED."
            echo
            echo "Found version-related strings:"
            strings trunk/user/rc/src/rc | grep -E '4\.4|FWREVSTR|FWBLDSTR|CUSTOM_FW' | head -30 || true
            exit 1
          fi

      - uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}-${{ env.BUILD_DATE }}
          path: trunk/images/*.trx

      - uses: ncipollo/release-action@main
        with:
          commit: ${{ github.sha }}
          tag: ${{ env.BUILD_DATE }}
          artifacts: trunk/images/*.trx
          allowUpdates: true
          omitBodyDuringUpdate: true

      - uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 1
