name: Build Firmware

on:
  watch:
    types: [started]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        target: [XY-C1]
        toolchain: [mipsel-linux-musl]

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 1
      - uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}

      - uses: actions/setup-go@main
        with:
          go-version: '1.23.x'
          check-latest: true
          cache: false

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext ccache \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev
          echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> $GITHUB_ENV

      # 【安全修改版】只动参数不动底层，原生生成 4.4-日期_hash 格式
      - name: Customize Firmware Version
        run: |
          cd trunk
          # 获取短日期 (例如 260828)
          SHORT_DATE=$(TZ='Asia/Shanghai' date +%y%m%d)
          
          # 将超长前缀改为干净的 4.4
          sed -i 's/^FIRMWARE_ROOTFS_VER=.*/FIRMWARE_ROOTFS_VER=4.4/' versions.inc
          
          # 将中间的版本号替换为当天的日期
          sed -i "s/^FIRMWARE_BUILDS_REV=.*/FIRMWARE_BUILDS_REV=${SHORT_DATE}/" versions.inc

      - name: Build Firmware
        run: |
          make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain }}

      - uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}-${{ env.BUILD_DATE }}
          path: trunk/images/*.trx

      - uses: ncipollo/release-action@main
        with:
          commit: ${{ github.sha }}
          tag: ${{ env.BUILD_DATE }}
          artifacts: trunk/images/*.trx
          allowUpdates: true
          omitBodyDuringUpdate: true

      - uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 1
