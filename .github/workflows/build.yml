name: Build Firmware

on:
  watch:
    types: [started]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    strategy:
      fail-fast: false

      matrix:
        target: [XY-C1]
        toolchain: [mipsel-linux-musl]

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 1

      - uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}

      - uses: actions/setup-go@main
        with:
          go-version: '1.23.x'
          check-latest: true
          cache: false

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext ccache \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev

          echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Customize Firmware Version
        run: |
          set -e

          GIT_REV=$(git rev-parse --short=7 HEAD)
          SHORT_DATE=$(TZ='Asia/Shanghai' date +%y%m%d)
          CUSTOM_VERSION="4.4_${GIT_REV}_${SHORT_DATE}"

          echo "========================================"
          echo "Git Commit       : ${GIT_REV}"
          echo "Build Date       : ${SHORT_DATE}"
          echo "Firmware Version : ${CUSTOM_VERSION}"
          echo "========================================"

          RC_FILE="trunk/user/rc/src/common_ex.c"
          HEADER_FILE="trunk/user/rc/src/custom_fw_version.h"

          echo
          echo "=== Restore common_ex.c from Git ==="
          git checkout -- "$RC_FILE"

          echo
          echo "=== Generate custom_fw_version.h ==="
          cat > "$HEADER_FILE" <<EOF
          #ifndef CUSTOM_FW_VERSION_H
          #define CUSTOM_FW_VERSION_H
          #define CUSTOM_FW_VERSION "${CUSTOM_VERSION}"
          #endif
          EOF

          cat "$HEADER_FILE"

          echo
          echo "=== Patch common_ex.c ==="

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("trunk/user/rc/src/common_ex.c")
          text = path.read_text()

          include_line = '#include "custom_fw_version.h"'

          if include_line not in text:
              marker = '#include "rc.h"'

              if marker not in text:
                  raise SystemExit('ERROR: #include "rc.h" not found')

              text = text.replace(
                  marker,
                  marker + '\n' + include_line,
                  1
              )

          pattern = re.compile(
              r'#if defined\(FWBLDSTR\).*?#endif\s*'
              r'#if defined\(FWREVSTR\).*?#endif',
              re.DOTALL
          )

          replacement = '''#ifdef CUSTOM_FW_VERSION
          snprintf(fwver_sub, sizeof(fwver_sub), "%s", CUSTOM_FW_VERSION);
          #endif'''

          text, count = pattern.subn(replacement, text, count=1)

          if count != 1:
              raise SystemExit(
                  f'ERROR: Expected exactly one FWBLDSTR/FWREVSTR block, found {count}'
              )

          path.write_text(text)

          print("common_ex.c patch completed successfully.")
          PY

          echo
          echo "=== Verify patched source ==="
          grep -n -A8 -B5 "CUSTOM_FW_VERSION" "$RC_FILE"

          echo
          echo "=== Verify no old version block remains ==="
          if grep -n "FWBLDSTR" "$RC_FILE"; then
            echo "ERROR: FWBLDSTR still exists in common_ex.c"
            exit 1
          fi

          if grep -n "FWREVSTR" "$RC_FILE"; then
            echo "ERROR: FWREVSTR still exists in common_ex.c"
            exit 1
          fi

          echo
          echo "Source patch verification: OK"

      - name: Build Firmware
        run: |
          set -e

          make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain }}

      - name: Verify Firmware Version
        run: |
          set -e

          GIT_REV=$(git rev-parse --short=7 HEAD)
          SHORT_DATE=$(TZ='Asia/Shanghai' date +%y%m%d)
          CUSTOM_VERSION="4.4_${GIT_REV}_${SHORT_DATE}"

          echo "========================================"
          echo "Expected Firmware Version:"
          echo "${CUSTOM_VERSION}"
          echo "========================================"

          echo
          echo "=== Locate rc binary ==="

          RC_BINARY=""

          if [ -f "trunk/build/rc/rc" ]; then
            RC_BINARY="trunk/build/rc/rc"
          elif [ -f "trunk/user/rc/rc" ]; then
            RC_BINARY="trunk/user/rc/rc"
          elif [ -f "trunk/user/rc/src/rc" ]; then
            RC_BINARY="trunk/user/rc/src/rc"
          fi

          if [ -z "$RC_BINARY" ]; then
            echo "ERROR: rc binary not found."
            find trunk -type f -name "rc" -print
            exit 1
          fi

          echo "RC binary: ${RC_BINARY}"

          echo
          echo "=== Check embedded firmware version ==="

          if strings "$RC_BINARY" | grep -F "${CUSTOM_VERSION}" >/dev/null 2>&1; then
            echo "SUCCESS: ${CUSTOM_VERSION} is embedded in rc."
          else
            echo "ERROR: ${CUSTOM_VERSION} was NOT found in rc."
            echo
            echo "Version-related strings found:"
            strings "$RC_BINARY" | grep -E '4\.4|FWBLDSTR|FWREVSTR|CUSTOM_FW_VERSION' | head -50 || true
            exit 1
          fi

      - uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}-${{ env.BUILD_DATE }}
          path: trunk/images/*.trx

      - uses: ncipollo/release-action@main
        with:
          commit: ${{ github.sha }}
          tag: ${{ env.BUILD_DATE }}
          artifacts: trunk/images/*.trx
          allowUpdates: true
          omitBodyDuringUpdate: true

      - uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 1
