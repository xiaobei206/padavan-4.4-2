          syscmd_end = sys_script.index('else if (strcmp(name, "syslog.sh")==0)', syscmd_start)
          syscmd = sys_script[syscmd_start:syscmd_end]
          assert 'if (SystemCmd[0] && get_login_safe())' in syscmd
          assert syscmd.index("SystemCmd[0] =", syscmd.index("} else {")) > syscmd.index("} else {")
          print("HTTPD SystemCmd trusted-session queue and stale-command guard: OK")

          # Direct apply.cgi actions and action_script values must pass a
          # per-operation trusted-session gate before any request mutation or
          # privileged sink. update.cgi has a direct eval special case for
          # networkmap_refresh, so its gate must precede that call as well.
          assert '#include "httpd_apply_request_policy.h"' in web
          apply_gate = apply_handler.index(
              "httpd_apply_request_allowed(value, script, get_login_safe())"
