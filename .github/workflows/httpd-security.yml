          assert 'char clients_l2[] = "/tmp/.vpns.leases.XXXXXX";' in ipdown
          assert "open(clients_l1, O_RDONLY | O_NOFOLLOW)" in ipdown
          assert "mkstemp(clients_l2)" in ipdown
          assert "fchmod(temp_fd, S_IRUSR | S_IWUSR)" in ipdown
          assert 'fdopen(temp_fd, "w")' in ipdown
          assert "rename(clients_l2, clients_l1)" in ipdown
          assert 'fopen(clients_l2, "w")' not in ipdown
          assert 'firewall_ppp_interface_is_safe("ppp10+", 10)' in firewall_test
          assert 'firewall_ppp_interface_is_safe("ppp65536", 10)' in firewall_test
          print("VPN lease file private descriptor and strict PPP token checks: OK")
          assert "mkstemp(path)" in firewall_rule_file
          assert 'fdopen(fd, "w")' in firewall_rule_file
          assert "fchmod(fd, S_IRUSR | S_IWUSR)" in firewall_rule_file
          assert "fflush(fp)" in firewall_rule_file and "ferror(fp)" in firewall_rule_file
          assert "fclose(fp)" in firewall_rule_file and "unlink(path)" in firewall_rule_file
          assert firewall.count("firewall_open_rule_file(ipt_file,") == 10
          assert firewall.count("firewall_rule_file_open(ipt_file)") == 0
          assert "cannot create private rule file" in firewall
          assert firewall.count('fopen(ipt_file, "w")') == 0
          assert firewall.count("firewall_finish_rule_file(fp, ipt_file,") == 10
          assert firewall.count("firewall_rule_file_finish(fp, ipt_file)") == 0
          assert "cannot flush/close private rule file" in firewall
          assert firewall.count("firewall_rule_file_remove(ipt_file)") == 10
          # IPv4/IPv6 firewall generation is intentionally staged separately.
          # Verify protocol-family-specific restore and ICMPv6 behavior so a
          # copy/paste regression cannot silently route IPv6 through iptables.
          ip6_filter_start = firewall.index("ip6t_filter_rules(")
          ip6_filter_end = firewall.index("ip6t_filter_default(", ip6_filter_start)
          ip6_filter = firewall[ip6_filter_start:ip6_filter_end]
          assert 'firewall_open_rule_file(ipt_file, "IPv6 filter")' in ip6_filter
          assert 'firewall_finish_rule_file(fp, ipt_file, "IPv6 filter")' in ip6_filter
          assert 'firewall_apply_core_restore("IPv6 filter restore", "ip6tables", "filter", ipt_file);' in ip6_filter
          assert '-p %d ! --icmpv6-type %s' in ip6_filter
          assert 'doSystem("iptables-restore %s", ipt_file)' not in ip6_filter
          ip6_mangle_start = firewall.index("ip6t_mangle_rules(")
