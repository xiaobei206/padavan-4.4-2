          assert "WIFEXITED(status)" in source and "WEXITSTATUS(status) != 0" in source
          assert "samba_secure_private_samba_dir()" in run_body
          assert "write_smb_conf() != 0" in run_body
          assert "samba_prepare_private_passdb(staged_passdb" in run_body
          assert 'rename(staged_passdb, "/etc/samba/smbpasswd")' in run_body
          assert "fchmod(input_fd, 0600)" in source
          handoff_start = source.index("samba_run_smbpasswd(")
          handoff_end = source.index("samba_secure_private_samba_dir()", handoff_start)
          handoff = source[handoff_start:handoff_end]
