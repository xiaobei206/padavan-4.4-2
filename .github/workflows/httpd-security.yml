          shutils = Path("trunk/user/shared/src/shutils.c").read_text()

          # doSystem() returns system(3)'s encoded wait status, not a plain
          # shell exit code. Require every built-in and add-on restore to be
          # wrapped so failures are visible in the router log.
          assert "return system(cmd_buf);" in shutils
          assert '#include "firewall_command_status.h"' in firewall
          assert "WIFEXITED(status)" in status_helper
          assert "WEXITSTATUS(status)" in status_helper
          assert "WIFSIGNALED(status)" in status_helper
          assert "firewall_command_status_signal(SIGTERM)" in status_test
          assert "firewall_restore_transaction_t" in transaction_helper
          assert "firewall_restore_transaction_apply" in transaction_helper
          assert "firewall_restore_transaction_abort" in transaction_helper
          assert "rollback_failed" in transaction_helper
          assert "iptables" in transaction_helper and "ip6tables" in transaction_helper
          assert '#include "firewall_restore_transaction.h"' in firewall
          assert "firewall_restore_transaction_prepare_reset" in transaction_helper
          assert "firewall_restore_transaction_prepare_reset" in firewall
          assert "firewall_restore_transaction_abort(" in firewall
          assert "Firewall rollback incomplete; recovery snapshot retained" in firewall
          assert 'doSystem("%s-save -t %s > %s", family, table, path)' in firewall
          assert 'doSystem("%s-restore %s", family, path)' in firewall
          core_restore_calls = re.findall(
              r'firewall_apply_core_restore\("[^"]+ restore",\s*"(?:ip6tables|iptables)",\s*"(?:filter|nat|mangle|raw)",\s*ipt_file\)',
              firewall
          )
          addon_restore_calls = re.findall(
              r'firewall_log_command_failure\("[^"]*restore",\s*doSystem\("(?:ip6tables-restore|iptables-restore)[^"]*"',
              firewall
          )
          assert len(core_restore_calls) == 10, len(core_restore_calls)
          assert len(addon_restore_calls) == 0, len(addon_restore_calls)
          assert "firewall_adbyby_restore_policy_apply" in adbyby_policy
          assert "firewall_adbyby_restore_policy_apply" in firewall
          assert "test_missing_snapshot_is_noop" in adbyby_policy_test
          assert "test_missing_ipset_skips_restore" in adbyby_policy_test
          assert "test_failed_extension_restore_is_reported" in adbyby_policy_test
          assert "test_successful_restore" in adbyby_policy_test
          assert 'return doSystem("ipset list blockip >/dev/null 2>&1");' in firewall
          assert 'return doSystem("iptables-restore -n %s", snapshot);' in firewall
          assert "firewall_log_command_failure(operation, status);" in firewall
          assert '"Adbyby blockip ipset preflight"' in adbyby_policy
          assert '"Adbyby iptables restore"' in adbyby_policy
          assert not re.search(r'^\s*doSystem\("(?:ip6tables|iptables)-restore', firewall, re.M)
          for call in (
              'firewall_log_command_failure("Shadowsocks firewall hook", doSystem("sh %s", shadowsocks_staged));',
          ):
              assert call in firewall
          assert 'firewall_log_command_failure("Persistent post-firewall hook",' in firewall
          assert 'doSystem("%s", int_iptables_staged)' in firewall
          assert 'firewall_log_command_failure("Optware iptables update hook",' in firewall
          assert 'doSystem("%s update", opt_iptables_staged)' in firewall
          assert firewall.count("firewall_log_command_failure(") == 7
          assert firewall.count("firewall_apply_core_restore(") == 11
          firewall_main = firewall[firewall.index("start_firewall_ex(void)"):]
          restore_gate = firewall_main.index("if (firewall_restore_transaction_ok(&firewall_core_restore_transaction))")
          assert firewall_main.index("firewall_core_restore_transaction_active = 1;") < firewall_main.index("ipt_raw_rules();")
          assert firewall_main.index("ipt_raw_rules();") < firewall_main.index("goto firewall_restore_complete;")
          for table_call in ("ipt_raw_rules();", "ipt_mangle_rules(", "ipt_nat_rules(", "ipt_filter_rules(",
                             "ip6t_mangle_rules(", "ip6t_nat_rules(", "ip6t_filter_rules("):
              assert firewall_main.index(table_call) < restore_gate, table_call
          for hook_call in ("firewall_hook_file_stage(shadowsocks_iptables_script",
                            "firewall_adbyby_restore_policy_apply(",
                            "firewall_hook_file_stage(int_iptables_script",
                            "firewall_hook_file_stage(opt_iptables_script"):
              assert restore_gate < firewall_main.index(hook_call), hook_call
          assert "Skipping extension firewall hooks after built-in table restore failure" in firewall_main[restore_gate:]
          assert "firewall_restore_transaction_rollback_failed(&firewall_core_restore_transaction)" in firewall_main
          assert "firewall_restore_transaction_prepare_reset" in firewall_main
          assert firewall_main.index("firewall_restore_transaction_prepare_reset") < firewall_main.index("ipt_raw_rules();")
          assert "Refusing firewall rebuild: previous recovery state remains unresolved" in firewall_main

          standalone_start = firewall.index("static int" + chr(10) + "firewall_apply_core_restore(")
          standalone_end = firewall.index(chr(10) + "static void" + chr(10) + "firewall_log_hook_stage_failure", standalone_start)
          standalone_restore = firewall[standalone_start:standalone_end]
          assert "firewall_restore_transaction_prepare_reset" in standalone_restore
          assert standalone_restore.index("firewall_restore_transaction_prepare_reset") < standalone_restore.index("firewall_restore_transaction_apply")
          assert "previous recovery state is unresolved" in standalone_restore
          assert "return -1;" in standalone_restore
          assert "set_ipv4_forward(0);" in firewall_main
          assert firewall.count('set_interface_conf_int("ipv6", "all", "forwarding", 0);') == 2
          assert "test_apply_failure_reverse_rollback" in transaction_test
          assert "test_snapshot_failure_rolls_back_prior_tables" in transaction_test
          assert "test_rollback_failure_retains_snapshots" in transaction_test
          assert "test_cleanup_failure_retains_snapshot_for_retry" in transaction_test
          assert "test_abort_cleanup_failure_is_retryable" in transaction_test
          assert "test_prepare_reset_refuses_cleanup_failure_then_retries" in transaction_test
          assert "test_prepare_reset_preserves_failed_rollback_recovery_set" in transaction_test
          assert "cleanup_failed" in transaction_helper
          assert "typedef int (*firewall_restore_remove_fn)" in transaction_helper
          assert "firewall_restore_transaction_finish" in transaction_test
          print("Firewall table restore transaction, reverse rollback and fail-closed recovery contracts: OK")
          print("Firewall restore and extension command failures are reported: OK")
          PY

      - name: Check root-managed executable script staging
        run: |
          set -eu
          sh -n trunk/user/scripts/files/usr/bin/ap_script.sh
          sh -n trunk/user/aliddns/aliddns.sh
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          ap = Path("trunk/user/scripts/files/usr/bin/ap_script.sh").read_text()
          aliddns = Path("trunk/user/aliddns/aliddns.sh").read_text()
          dev_init = Path("trunk/user/scripts/files/sbin/dev_init.sh").read_text()

          # The AP daemon is staged with an atomic mkdir under the private /home/root tmpfs parent.
          # The private 0700 parent prevents local replacement or modification.
          assert 'ap_auto_candidate="/home/root/.sh_apauto.$RANDOM.$ap_auto_try"' in ap
          assert 'if mkdir "$ap_auto_candidate" 2>/dev/null; then' in ap
          assert "umask 077" in ap
          assert 'ap_auto_script="$ap_auto_dir/sh_apauto.sh"' in ap
          assert 'cat > "$ap_auto_script" <<-\\EOF' in ap
          body_start_marker = 'cat > "$ap_auto_script" <<-\\EOF' + chr(10)
          body_start = ap.index(body_start_marker) + len(body_start_marker)
          body_end = ap.index(chr(10) + "EOF", body_start)
          subprocess.run(["sh", "-n"], input=ap[body_start:body_end], text=True, check=True)
          assert "trap ap_auto_cleanup EXIT" in ap
          assert 'chmod 700 "$ap_auto_script"' in ap
          assert 'chmod 777 "/tmp/sh_apauto.sh"' not in ap
          assert 'cat >/tmp/sh_apauto.sh' not in ap
          assert "/tmp/sh_apauto.sh" not in ap

          # AliDDNS's launcher lives in a private tmpfs directory.
          assert 'ALIDDNS_HELPER_DIR="/home/root/.aliddns"' in aliddns
          assert 'ALIDDNS_HELPER="$ALIDDNS_HELPER_DIR/_aliddns"' in aliddns
          assert 'export PATH="/etc/storage/bin:$ALIDDNS_HELPER_DIR:/tmp/script:' in aliddns
          assert '(umask 077; mkdir "$ALIDDNS_HELPER_DIR")' in aliddns
          assert 'chmod 700 "$ALIDDNS_HELPER_DIR"' in aliddns
          assert "printf '#!/bin/sh" in aliddns
          assert ' > "$ALIDDNS_HELPER")' in aliddns
          assert 'chmod 700 "$ALIDDNS_HELPER"' in aliddns
          assert 'kill_ps "$ALIDDNS_HELPER"' in aliddns
          assert "/tmp/script/_aliddns" not in aliddns
          assert "mount -t tmpfs tmpfs /home" in dev_init
          assert "mkdir -p -m 700 /home/root" in dev_init
          print("Root-managed AP and AliDDNS temporary executable staging: OK")
          PY

