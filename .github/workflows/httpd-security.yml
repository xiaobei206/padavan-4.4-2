          assert "(st.st_mode & 0777) == 0600" in firewall_rule_file_test
          print("Firewall IPv4/IPv6 restore files use exclusive 0600 staging and checked cleanup: OK")

          # Session ownership is a 30-second idle lock, not a fixed 30 seconds
