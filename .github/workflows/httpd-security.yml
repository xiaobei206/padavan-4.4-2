          status_helper = Path("trunk/user/rc/src/firewall_command_status.h").read_text()
          status_test = Path("trunk/user/rc/src/tests/firewall_command_status.c").read_text()
          transaction_helper = Path("trunk/user/rc/src/firewall_restore_transaction.h").read_text()
          transaction_test = Path("trunk/user/rc/src/tests/firewall_restore_transaction.c").read_text()
