              "trunk/user/samba36/patches/111-owrt_smbpasswd.patch",
          ))
          print("Samba storage-account and Unix passwd/group identity contracts: OK")
          PY
      - name: Verify PID 1 signal deferral and child reaping safety
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/pid1_signal_policy.c \
            -o /tmp/pid1_signal_policy
          /tmp/pid1_signal_policy
          python3 - <<'PY'
          from pathlib import Path

          init = Path("trunk/user/rc/src/init.c").read_text()
          policy = Path("trunk/user/rc/src/pid1_signal_policy.h").read_text()
          workflow = Path(".github/workflows/httpd-security.yml").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          def array_items(source, name):
              start = source.index("static const int " + name + "[]")
              end = source.index("};", start)
              return set(source[start:end].split("{", 1)[1].replace(",", " ").split())

          event = body(init, "catch_sig_event(int sig)")
          shutdown = body(init, "catch_sig_shutdown(int sig)")
          reap = body(init, "catch_sig_reap(int sig)")
          fatal = body(init, "handle_sig_fatal(int sig)")
          main_loop = body(init, "init_main_loop(void)")
          setup = body(init, "init_signals(void)")

          assert "pid1_signal_record_event(&signal_state, sig);" in event
          assert not any(token in event for token in ("printf(", "dprintf(", "strsignal(", "notify_shutdown", "shutdown_router("))
          assert "pid1_signal_record_shutdown(&signal_state, sig);" in shutdown
          assert not any(token in shutdown for token in ("printf(", "dprintf(", "strsignal(", "shutdown_router(", "system("))
          assert "waitpid(-1, NULL, WNOHANG)" in reap and "errno == EINTR" in reap
          assert not any(token in reap for token in ("printf(", "dprintf(", "perror(", "fprintf("))

          assert array_items(init, "signals_fatal") == {
              "SIGILL", "SIGSEGV", "SIGABRT", "SIGFPE", "SIGBUS", "SIGSYS", "SIGTRAP"
          }
          assert array_items(init, "signals_shutdown") == {"SIGPIPE", "SIGPWR", "SIGQUIT", "SIGTERM"}
          assert "sa.sa_handler = catch_sig_shutdown;" in setup
          assert "sigaction(signals_shutdown[i], &sa, NULL);" in setup
          assert "handle_sig_fatal((int)signal_state.shutdown_signal);" in main_loop
          assert "signal_state.shutdown_pending && !shutdown_handled" in main_loop
          assert "sigprocmask(SIG_BLOCK, &wait_mask, &original_mask);" in main_loop
          assert "sigsuspend(&original_mask);" in main_loop
          assert "sigprocmask(SIG_SETMASK, &original_mask, NULL);" in main_loop
          assert "sigprocmask(SIG_BLOCK, &wait_mask, NULL);" in main_loop
          assert "shutdown_router(0);" in fatal and "reboot(RB_AUTOBOOT);" in fatal
          assert "static inline void" in policy
          assert "volatile sig_atomic_t shutdown_pending;" in policy
          assert "state->shutdown_pending" in policy

          triggers = (
              "trunk/user/rc/src/init.c",
              "trunk/user/rc/src/pid1_signal_policy.h",
              "trunk/user/rc/src/tests/pid1_signal_policy.c",
          )
          push = workflow.split("  pull_request:", 1)[0]
          pr = workflow.split("  pull_request:", 1)[1].split("  workflow_dispatch:", 1)[0]
          for path in triggers:
              assert '"' + path + '"' in push
              assert '"' + path + '"' in pr

          print("PID 1 async signal deferral and SIGCHLD reaping contracts: OK")
          PY

      - name: Verify bounded service termination and WAN stop failure gates
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/service_lifecycle_policy.c \
            -o /tmp/service_lifecycle_policy
          /tmp/service_lifecycle_policy
          python3 - <<'PY'
          from pathlib import Path

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          policy = Path("trunk/user/rc/src/service_lifecycle_policy.h").read_text()
          common = Path("trunk/user/rc/src/common_ex.c").read_text()
          wan = Path("trunk/user/rc/src/net_wan.c").read_text()
          services = Path("trunk/user/rc/src/services.c").read_text()
          rc = Path("trunk/user/rc/src/rc.c").read_text()
          header = Path("trunk/user/rc/src/rc.h").read_text()
          ppp = Path("trunk/user/rc/src/net_ppp.c").read_text()

          assert "SERVICE_LIFECYCLE_FORCE_WAIT_SECONDS 3" in policy
          assert "SIGTERM" in policy and "SIGKILL" in policy
          assert "service_lifecycle_wait_for_exit" in policy
          assert "return service_lifecycle_wait_for_exit" in policy
          assert "service_lifecycle_stop(svc_name, wtimeout, forcekill, &ops, NULL)" in common
          assert "service stop incomplete: %s remains active" in common

          stop_ppp = body(wan, "stop_wan_ppp(void)")
          stop_wan = body(wan, "stop_wan(void)")
          full_restart = body(wan, "full_restart_wan(void)")
          reconnect = body(wan, "try_wan_reconnect(int try_use_modem, long pause_in_seconds)")
          manual_disconnect = body(wan, "manual_wan_disconnect(void)")
          assert "if (kill_services(svcs_ppp, 6, 1) != 0)" in stop_ppp
          assert stop_ppp.index("return -1;") < stop_ppp.index("clear_wan_state();")
          assert stop_wan.count("if (kill_services(") == 2
          assert stop_wan.count("return -1;") == 2
          assert "if (stop_wan() != 0)" in full_restart
          assert full_restart.index("if (stop_wan() != 0)") < full_restart.index("reset_wan_vars();")
          assert "if (stop_wan() != 0)" in reconnect
          assert reconnect.index("if (stop_wan() != 0)") < reconnect.index("reset_wan_vars();")
          assert "if (stop_wan_ppp() != 0)" in manual_disconnect

          stop_misc = body(services, "stop_misc(void)")
          assert "return kill_services(svcs, 3, 1);" in stop_misc
          flash = body(rc, "flash_firmware(void)")
          assert "if (kill_services(svcs, 6, 1) != 0)" in flash
          assert "if (stop_misc() != 0)" in flash
          assert flash.index("if (stop_misc() != 0)") < flash.index("safe_remove_all_stor_devices(0)")

          assert "int kill_services(char* svc_name[], int wtimeout, int forcekill);" in header
          assert "int stop_wan(void);" in header
          assert "int stop_misc(void);" in header

          launch_pppd = body(ppp, "launch_wan_pppd(int unit, int wan_proto)")
          l2tp_stop = body(launch_pppd, "if (wan_proto == IPV4_WAN_PROTO_L2TP)")
          launch_phase = launch_pppd[launch_pppd.index("errno = 0;"):]
          l2tp_start = body(launch_phase, "if (wan_proto == IPV4_WAN_PROTO_L2TP)")
          stop_failure = body(l2tp_stop, "if (kill_services(svcs, 5, 1) != 0)")
          assert launch_pppd.count("kill_services(svcs, 5, 1)") == 1
          assert launch_pppd.index("if (wan_proto == IPV4_WAN_PROTO_L2TP)") < launch_pppd.index("ppp_options_file_open(options)")
          assert "errno = EBUSY;" in stop_failure and "return -1;" in stop_failure
          assert "refusing L2TP WAN launch: %s did not stop" in stop_failure
          assert launch_pppd.index("ppp_options_file_open(options)") < launch_pppd.index("ppp_options_file_finish(fp, options)")
          assert launch_pppd.index("ppp_options_file_finish(fp, options)") < launch_pppd.index("safe_start_xl2tpd()")
          assert "kill_services(svcs, 5, 1);" not in launch_pppd
          if '#if defined (APP_RPL2TP)' in l2tp_stop:
              assert l2tp_stop.index('use_rpl2tp = nvram_match("wan_l2tpd", "1")') < l2tp_stop.index("kill_services(svcs, 5, 1)")
              assert 'svcs[0] = "l2tpd";' in l2tp_stop and 'svcs[0] = "xl2tpd";' in l2tp_stop
              assert l2tp_start.index("if (use_rpl2tp)") < l2tp_start.index("start_rpl2tp(unit)")
              assert l2tp_start.index('nvram_set_int_temp("l2tp_wan_t", 0);') < l2tp_start.index("start_rpl2tp(unit)")
          assert l2tp_start.index('nvram_set_int_temp("l2tp_wan_t", 1);') < l2tp_start.index("safe_start_xl2tpd()")
          print("Service termination, WAN stop gates and L2TP transport startup contracts: OK")
          PY
