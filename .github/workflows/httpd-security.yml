          assert 'strncasecmp(cur, "Host:", 5)' in request
          assert "origin_invalid" in request and "referer_invalid" in request
          assert 'send_error(403, "Forbidden"' in request[csrf_gate:auth_gate]
          assert "httpd_csrf_url_matches_host" in csrf_policy
          assert "Origin takes precedence over Referer" in csrf_policy
