          assert "HTTPD_FILE_TYPE_SCRIPT, 1" in script_policy_test
          ap_script_entries = [
              line for line in variables.splitlines()
              if '"scripts.ap_script.sh"' in line
          ]
          assert len(ap_script_entries) == 2
          assert all("EVM_BLOCK_UNSAFE" in line for line in ap_script_entries)
          assert 'if (!strcmp(file_name, "ap_script.sh") && get_login_safe())' in web

          # Fixed sys_script handlers are an explicit compatibility allowlist.
          fixed_names = ["syscmd.sh","syslog.sh","wan.sh","printer.sh","lpr_remove","mfp_requeue","mfp_monopolize","wlan11a.sh","wlan11b.sh","eth_wan.sh","eth_lan1.sh","eth_lan2.sh","eth_lan3.sh","eth_lan4.sh","leases.sh","vpns_list.sh","iptable.sh","route.sh","conntrack.sh","ddnsclient","hostname_check","dlna_rescan"]
          for fixed_name in fixed_names:
