          login = httpd[login_start:login_end]
          assert "login_last_activity = (unsigned long)login_timestamp;" in login
          reset_start = httpd.index("reset_login_data(void)")
          reset_end = httpd.index(chr(10) + "static void" + chr(10) + "http_logout", reset_start)
          assert "login_last_activity = 0;" in httpd[reset_start:reset_end]
          check_start = httpd.index("http_login_check(const uaddr *ip_now)")
          check_end = httpd.index(chr(10) + "static int" + chr(10) + "initialize_listen_socket", check_start)
          check = httpd[check_start:check_end]
