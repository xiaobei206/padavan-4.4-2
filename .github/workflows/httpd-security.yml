          print("HTTPD fixed sys_script dispatch allowlist: OK")
          print("HTTPD executable script write and execution trust boundary: OK")

          print("HTTPD strict Basic authentication and decoder wiring: OK")

          print("HTTPD private-key access policy and call-site wiring: OK")
          PY

