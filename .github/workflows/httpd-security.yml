          assert folder_block.index("samba_mount_path_is_safe(follow_partition->mount_point)") < folder_block.index('fprintf(fp, "path = %s/%s\\n"')
          assert folder_block.count("if (!samba_service_account_is_safe(account_list[i]))") == 4

          # Anonymous SMB users must map to locked UID 99, never http_username (UID 0).
          guest_start = source.index("if (i_smb_mode == 1 || i_smb_mode == 3) {")
