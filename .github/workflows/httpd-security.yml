name: HTTPD Authentication and Security Regression

on:
  push:
    paths:
      - ".github/workflows/httpd-security.yml"
      - "trunk/user/httpd/src/httpd.c"
      - "trunk/user/httpd/src/base64.c"
      - "trunk/user/httpd/src/httpd_basic_auth.h"
      - "trunk/user/httpd/src/tests/httpd_basic_auth.c"
      - "trunk/user/httpd/src/httpd_login_policy.h"
      - "trunk/user/httpd/src/tests/httpd_login_policy.c"
      - "trunk/user/httpd/src/httpd.h"
      - "trunk/user/httpd/src/web_ex.c"
      - "trunk/user/httpd/src/httpd_access_policy.h"
      - "trunk/user/httpd/src/tests/httpd_private_key_policy.c"
  pull_request:
    paths:
      - ".github/workflows/httpd-security.yml"
      - "trunk/user/httpd/src/httpd.c"
      - "trunk/user/httpd/src/base64.c"
      - "trunk/user/httpd/src/httpd_basic_auth.h"
      - "trunk/user/httpd/src/tests/httpd_basic_auth.c"
      - "trunk/user/httpd/src/httpd_login_policy.h"
      - "trunk/user/httpd/src/tests/httpd_login_policy.c"
      - "trunk/user/httpd/src/httpd.h"
      - "trunk/user/httpd/src/web_ex.c"
      - "trunk/user/httpd/src/httpd_access_policy.h"
      - "trunk/user/httpd/src/tests/httpd_private_key_policy.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  httpd-security:
    name: HTTPD authentication and disclosure policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile and run policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/httpd/src \
            trunk/user/httpd/src/tests/httpd_private_key_policy.c \
            -o /tmp/httpd_private_key_policy
          /tmp/httpd_private_key_policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/httpd/src \
            trunk/user/httpd/src/base64.c \
            trunk/user/httpd/src/tests/httpd_basic_auth.c \
            -o /tmp/httpd_basic_auth
          /tmp/httpd_basic_auth
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/httpd/src \
            trunk/user/httpd/src/tests/httpd_login_policy.c \
            -o /tmp/httpd_login_policy
          /tmp/httpd_login_policy

      - name: Verify HTTPD auth and route-access wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("trunk/user/httpd/src")
          httpd = (root / "httpd.c").read_text()
          web = (root / "web_ex.c").read_text()

          getter_start = httpd.index("get_login_private_key_access(void)")
          getter_end = httpd.index("\nstatic void\nhttp_login", getter_start)
          getter = httpd[getter_start:getter_end]
          assert "httpd_private_key_access_allowed(login_ip.len != 0, login_safe)" in getter
          assert "http_is_ssl" not in getter

          dump_start = web.index("static int\ndump_file(")
          dump_end = web.index("static int\nej_dump", dump_start)
          dump = web[dump_start:dump_end]
          assert 'get_login_private_key_access()' in dump
          assert 'strcmp(extensions, ".key") == 0' in dump

          # The Shadowsocks dbconf API returns persisted proxy-node objects.
          # It must pass through the same HTTP authentication gate as its page.
          dbconf_routes = [
              line for line in web.splitlines()
              if '"dbconf"' in line and 'do_dbconf' in line
          ]
          assert len(dbconf_routes) == 1
          assert dbconf_routes[0].rstrip().endswith("do_dbconf, 1 },")

          request_start = httpd.index("handle_request(FILE *conn_fp")
          request_end = httpd.index("reset_lang_dict(void)", request_start)
          request = httpd[request_start:request_end]
          auth_gate = request.index("if (handler->need_auth && login_state > 1")
          output_call = request.index("handler->output(file, conn_fp)")
          assert auth_gate < output_call
          assert "auth_check(authorization)" in request[auth_gate:output_call]

          # Preserve the existing HTTPS allowance for unrelated remote-admin
          # operations; the private-key policy is intentionally narrower.
          assert "if (http_is_ssl)\n\t\treturn 1;" in httpd
          # Basic credentials must use a strict, bounded and unambiguous decoder.
          basic = (root / "httpd_basic_auth.h").read_text()
          base64 = (root / "base64.c").read_text()
          makefile = (root / "Makefile").read_text()
          auth_start = httpd.index("auth_check( const char *authorization )")
          auth_end = httpd.index("\nstatic int\nmatch_one", auth_start)
          auth = httpd[auth_start:auth_end]
          assert '#include "httpd_basic_auth.h"' in httpd
          assert "httpd_decode_basic_authorization" in auth
          assert "b64_decode(" not in auth
          assert 'strncasecmp(authorization, "Basic", 5)' in basic
          assert "authorization[5] != ' '" in basic
          assert "b64_decode_strict" in basic and "b64_decode_strict" in base64
          assert "memchr(decoded," in basic
          assert "static const signed char b64_decode_table[256]" in base64
          assert "base64.o" in makefile

          # Session ownership is a 30-second idle lock, not a fixed 30 seconds
          # from first login. Preserve the initial-login timestamp for UI use.
          login_policy = (root / "httpd_login_policy.h").read_text()
          assert "static unsigned long login_last_activity = 0;" in httpd
          login_start = httpd.index("http_login(const uaddr *ip_now)")
          login_end = httpd.index(chr(10) + "static void" + chr(10) + "load_nvram_auth", login_start)
          login = httpd[login_start:login_end]
          assert "login_last_activity = (unsigned long)login_timestamp;" in login
          reset_start = httpd.index("reset_login_data(void)")
          reset_end = httpd.index(chr(10) + "static void" + chr(10) + "http_logout", reset_start)
          assert "login_last_activity = 0;" in httpd[reset_start:reset_end]
          check_start = httpd.index("http_login_check(const uaddr *ip_now)")
          check_end = httpd.index(chr(10) + "static int" + chr(10) + "initialize_listen_socket", check_start)
          check = httpd[check_start:check_end]
          assert "httpd_login_session_expired((unsigned long)uptime()," in check
          assert "login_last_activity, LOGIN_TIMEOUT)" in check
          assert "unsigned long)(now - last_activity)" in login_policy
          activity_refresh = request.index("login_last_activity = (unsigned long)uptime();")
          auth_check = request.index("if (!auth_check(authorization))", auth_gate)
          assert auth_check < activity_refresh
          assert "else if (login_state == 3)" in request[auth_gate:activity_refresh]
          print("HTTPD strict Basic authentication and decoder wiring: OK")

          print("HTTPD private-key access policy and call-site wiring: OK")
          PY
