          assert "st.st_uid != 0" in lease_open and "st.st_nlink != 1" in lease_open
          assert "fchmod(fd, S_IRUSR | S_IWUSR)" in lease_open
          assert 'fdopen(fd, "a")' in lease_open

          ipup_start = vpn_server.index("ipup_vpns_main(int argc, char **argv)")
          ipdown_start = vpn_server.index("ipdown_vpns_main(int argc, char **argv)", ipup_start)
          ipup = vpn_server[ipup_start:ipdown_start]
          ipdown = vpn_server[ipdown_start:]
          for function_body in (ipup, ipdown):
