          vpn_clients_end = firewall.index(chr(10) + "}", vpn_clients_start)
          vpn_clients = firewall[vpn_clients_start:vpn_clients_end]
          assert "open(VPN_SERVER_LEASE_FILE, O_RDONLY | O_NOFOLLOW)" in vpn_clients
          assert "lease_stat.st_uid != 0" in vpn_clients
          assert "lease_stat.st_nlink != 1" in vpn_clients
          assert "(lease_stat.st_mode & 077) != 0" in vpn_clients
          assert "firewall_ppp_interface_is_safe(ifname, VPN_SERVER_PPP_UNIT)" in vpn_clients
          assert "ppp_ifindex(ifname)" not in vpn_clients
