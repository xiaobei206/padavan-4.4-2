          assert "strdup(password)" not in passdb_patch
          assert "pw = argv[2]" not in passdb_patch
          assert 'doSystem("rm -f %s", "/etc/samba/*")' not in run_body

          # A failed disk/account discovery, append open, or stream close must
          # abort configuration generation instead of returning false success.
          writer_start = source.index("write_smb_conf(void)")
          writer_end = source.index("static void" + chr(10) + "clean_smbd_trash", writer_start)
          writer = source[writer_start:writer_end]
          assert "if (!disks_info)" in writer
          assert "disks_info = read_disk_data();" in writer
          assert "if (get_account_list(&acc_num, &account_list) < 0)" in writer
          assert 'fp = fopen(SAMBA_CONF, "a");' in writer
