          assert 'httpd_apply_request_allowed(" Apply ", "networkmap_refresh", 0)' in apply_policy_test
          assert 'httpd_apply_request_allowed(" Apply ", "unknown_script.sh", 0)' in apply_policy_test
          print("HTTPD apply.cgi action and action_script trusted-session policy: OK")

          # The generic sys_script fallback executes /tmp/<name> through _eval
          # as root. action_script is POST-controlled on authenticated CGI routes,
          # so the generic fallback must additionally require a trusted session.
          # Fixed named handlers above retain their existing policy.
          fallback_start = sys_script.rfind("else")
          assert fallback_start >= 0, "generic sys_script fallback not found"
          fallback = sys_script[fallback_start:]
          trusted_gate = fallback.index("if (!get_login_safe())")
          argv_parse = fallback.index("strtok(name_copy")
          eval_dispatch = fallback.index("_eval(script_argv")
          assert trusted_gate < argv_parse < eval_dispatch
          assert 'snprintf(scmd, sizeof(scmd), "/tmp/%s", token)' in fallback
          assert 'script = websGetVar(wp, "action_script", "");' in update_handler
          assert "sys_script(script);" in update_handler
          assert 'script = websGetVar(wp, "action_script","");' in apply_handler
          assert "sys_script(script);" in apply_handler
          print("HTTPD generic /tmp script trusted-session guard: OK")
          # Executable scripts are root-managed programs. Enforce their trust
          # boundary in the common file writer even if a variable's event mask
          # is accidentally missing EVM_BLOCK_UNSAFE.
