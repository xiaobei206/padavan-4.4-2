name: HTTPD Authentication and Security Regression

on:
  push:
    paths:
      - ".github/workflows/httpd-security.yml"
      - "trunk/user/httpd/src/httpd.c"
      - "trunk/user/httpd/src/upload.c"
      - "trunk/user/busybox/busybox-1.24.x/archival/libarchive/data_extract_all.c"
      - "trunk/user/busybox/busybox-1.24.x/archival/libarchive/safe_extract_path.h"
      - "trunk/user/busybox/busybox-1.24.x/archival/libarchive/tests/safe_extract_path.c"
      - "trunk/user/scripts/files/sbin/mtd_storage.sh"
      - "trunk/user/scripts/files/sbin/dev_init.sh"
      - "trunk/user/scripts/files/usr/bin/ap_script.sh"
      - "trunk/user/scripts/files/usr/bin/autostart.sh"
      - "trunk/user/scripts/files/usr/bin/ap_script_migrate.sh"
      - "trunk/user/scripts/tests/ap_script_migration.sh"
      - "trunk/user/scripts/tests/fixtures/ap_script_legacy_stock.sh"
      - "trunk/user/aliddns/aliddns.sh"
      - "trunk/user/httpd/src/base64.c"
      - "trunk/user/httpd/src/httpd_basic_auth.h"
      - "trunk/user/httpd/src/tests/httpd_basic_auth.c"
      - "trunk/user/httpd/src/httpd_login_policy.h"
      - "trunk/user/httpd/src/tests/httpd_login_policy.c"
      - "trunk/user/httpd/src/httpd.h"
      - "trunk/user/httpd/src/web_ex.c"
      - "trunk/user/httpd/src/variables.c"
      - "trunk/user/httpd/src/httpd_script_policy.h"
      - "trunk/user/httpd/src/tests/httpd_script_policy.c"
      - "trunk/user/httpd/src/common.c"
      - "trunk/user/httpd/src/tests/httpd_service_id.c"
      - "trunk/user/httpd/src/httpd_access_policy.h"
      - "trunk/user/httpd/src/tests/httpd_private_key_policy.c"
      - "trunk/user/rc/src/firewall_ex.c"
      - "trunk/user/rc/src/vpn_server.c"
      - "trunk/user/rc/src/firewall_filter_policy.h"
      - "trunk/user/rc/src/tests/firewall_filter_policy.c"
      - "trunk/user/rc/src/firewall_rule_file.h"
      - "trunk/user/rc/src/tests/firewall_rule_file.c"
      - "trunk/user/rc/src/firewall_hook_file.h"
      - "trunk/user/rc/src/tests/firewall_hook_file.c"
      - "trunk/user/rc/src/firewall_command_status.h"
      - "trunk/user/rc/src/tests/firewall_command_status.c"
      - "trunk/user/shared/src/shutils.c"
      - "trunk/user/adbyby/adbyby.sh"
      - "trunk/user/adbyby/tests/firewall_snapshot.sh"
  pull_request:
    paths:
      - ".github/workflows/httpd-security.yml"
      - "trunk/user/httpd/src/httpd.c"
      - "trunk/user/httpd/src/upload.c"
      - "trunk/user/busybox/busybox-1.24.x/archival/libarchive/data_extract_all.c"
      - "trunk/user/busybox/busybox-1.24.x/archival/libarchive/safe_extract_path.h"
      - "trunk/user/busybox/busybox-1.24.x/archival/libarchive/tests/safe_extract_path.c"
      - "trunk/user/scripts/files/sbin/mtd_storage.sh"
      - "trunk/user/scripts/files/sbin/dev_init.sh"
      - "trunk/user/scripts/files/usr/bin/ap_script.sh"
      - "trunk/user/scripts/files/usr/bin/autostart.sh"
      - "trunk/user/scripts/files/usr/bin/ap_script_migrate.sh"
      - "trunk/user/scripts/tests/ap_script_migration.sh"
      - "trunk/user/scripts/tests/fixtures/ap_script_legacy_stock.sh"
      - "trunk/user/aliddns/aliddns.sh"
      - "trunk/user/httpd/src/base64.c"
      - "trunk/user/httpd/src/httpd_basic_auth.h"
      - "trunk/user/httpd/src/tests/httpd_basic_auth.c"
      - "trunk/user/httpd/src/httpd_login_policy.h"
      - "trunk/user/httpd/src/tests/httpd_login_policy.c"
      - "trunk/user/httpd/src/httpd.h"
      - "trunk/user/httpd/src/web_ex.c"
      - "trunk/user/httpd/src/httpd_script_policy.h"
      - "trunk/user/httpd/src/tests/httpd_script_policy.c"
      - "trunk/user/httpd/src/variables.c"
      - "trunk/user/httpd/src/common.c"
      - "trunk/user/httpd/src/tests/httpd_service_id.c"
      - "trunk/user/httpd/src/httpd_access_policy.h"
      - "trunk/user/httpd/src/tests/httpd_private_key_policy.c"
      - "trunk/user/rc/src/firewall_ex.c"
      - "trunk/user/rc/src/vpn_server.c"
      - "trunk/user/rc/src/firewall_filter_policy.h"
      - "trunk/user/rc/src/tests/firewall_filter_policy.c"
      - "trunk/user/rc/src/firewall_rule_file.h"
      - "trunk/user/rc/src/tests/firewall_rule_file.c"
      - "trunk/user/rc/src/firewall_hook_file.h"
      - "trunk/user/rc/src/tests/firewall_hook_file.c"
      - "trunk/user/rc/src/firewall_command_status.h"
      - "trunk/user/rc/src/tests/firewall_command_status.c"
      - "trunk/user/shared/src/shutils.c"
      - "trunk/user/adbyby/adbyby.sh"
      - "trunk/user/adbyby/tests/firewall_snapshot.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  httpd-security:
    name: HTTPD authentication and disclosure policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify stock AP script migration
        run: |
          set -eu
          sh -n trunk/user/scripts/files/usr/bin/autostart.sh
          sh -n trunk/user/scripts/files/usr/bin/ap_script_migrate.sh
          sh -n trunk/user/scripts/tests/ap_script_migration.sh
          sh trunk/user/scripts/tests/ap_script_migration.sh
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/scripts/files/usr/bin/autostart.sh").read_text()
          helper = Path("trunk/user/scripts/files/usr/bin/ap_script_migrate.sh").read_text()
          migrate = source.index("/usr/bin/ap_script_migrate.sh")
          launch = source.index("/etc/storage/ap_script.sh >/dev/null 2>&1 &")
          assert migrate < launch
          assert "if [ -x /etc/storage/ap_script.sh ]; then" in source
          assert "sha256sum" in helper and 'mkdir "$candidate_dir"' in helper
          assert 'candidate_dir="$storage_dir/.ap_script_migrate.' + "$" * 2 + '.$attempt"' in helper
          assert "$(mktemp" not in helper
          print("AP stock-only migration autostart and target-BusyBox integration: OK")
          PY

      - name: Compile and run policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/httpd/src \
            trunk/user/httpd/src/tests/httpd_private_key_policy.c \
            -o /tmp/httpd_private_key_policy
          /tmp/httpd_private_key_policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/httpd/src \
            trunk/user/httpd/src/base64.c \
            trunk/user/httpd/src/tests/httpd_basic_auth.c \
            -o /tmp/httpd_basic_auth
          /tmp/httpd_basic_auth
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/httpd/src \
            trunk/user/httpd/src/tests/httpd_login_policy.c \
            -o /tmp/httpd_login_policy
          /tmp/httpd_login_policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/httpd/src \
            trunk/user/httpd/src/tests/httpd_script_policy.c \
            -o /tmp/httpd_script_policy
          /tmp/httpd_script_policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/httpd/src \
            trunk/user/httpd/src/common.c \
            trunk/user/httpd/src/tests/httpd_service_id.c \
            -o /tmp/httpd_service_id
          /tmp/httpd_service_id
          cc -std=gnu89 -Wall -Wextra -Werror \
            trunk/user/busybox/busybox-1.24.x/archival/libarchive/tests/safe_extract_path.c \
            -o /tmp/busybox_safe_extract_path
          /tmp/busybox_safe_extract_path
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/firewall_filter_policy.c \
            -o /tmp/firewall_filter_policy
          /tmp/firewall_filter_policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/firewall_rule_file.c \
            -o /tmp/firewall_rule_file
          /tmp/firewall_rule_file
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/firewall_hook_file.c \
            -o /tmp/firewall_hook_file
          /tmp/firewall_hook_file

      - name: Verify add-on firewall hook staging
        run: |
          set -eu
          sh -n trunk/user/adbyby/adbyby.sh
          sh -n trunk/user/adbyby/tests/firewall_snapshot.sh
          sh trunk/user/adbyby/tests/firewall_snapshot.sh
          python3 - <<'PY'
          from pathlib import Path
          firewall = Path("trunk/user/rc/src/firewall_ex.c").read_text()
          helper = Path("trunk/user/rc/src/firewall_hook_file.h").read_text()
          helper_test = Path("trunk/user/rc/src/tests/firewall_hook_file.c").read_text()
          adbyby = Path("trunk/user/adbyby/adbyby.sh").read_text()
          dev_init = Path("trunk/user/scripts/files/sbin/dev_init.sh").read_text()
          dispatch = firewall[firewall.index("start_firewall_ex(void)"):]
          assert '#include "firewall_hook_file.h"' in firewall
          assert "O_NOFOLLOW" in helper and "st_uid != geteuid()" in helper
          assert "st_nlink != 1" in helper and "FIREWALL_HOOK_FILE_MAX_BYTES" in helper
          assert "firewall_hook_file_stage(" in dispatch
          assert 'doSystem("sh %s", shadowsocks_staged);' in dispatch
          assert 'doSystem("sh %s", shadowsocks_iptables_script);' not in dispatch
          assert "firewall_hook_file_remove(shadowsocks_staged);" in dispatch
          assert '"/tmp/shadowsocks_iptables.save"' in dispatch
          assert '"/home/root/.adbyby.save"' in dispatch
          assert '"/tmp/adbyby.save"' not in dispatch
          assert "symlink(src,linkp)" in helper_test
          assert "S_IWGRP | S_IWOTH" in helper
          assert "save_adbyby_rule_snapshot" in adbyby
          assert 'final_file="$save_dir/.adbyby.save"' in adbyby
          assert 'umask 077' in adbyby and 'mv -f "$next_file" "$final_file"' in adbyby
          assert "/tmp/adbyby.save" not in adbyby
          assert "mkdir -p -m 700 /home/root" in dev_init
          print("Add-on firewall hook provenance, private staging and snapshot contracts: OK")
          PY

      - name: Check firewall command status reporting
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -Itrunk/user/rc/src \
            trunk/user/rc/src/tests/firewall_command_status.c \
            -o /tmp/firewall_command_status
          /tmp/firewall_command_status
          python3 - <<'PY'
          import re
          from pathlib import Path

          firewall = Path("trunk/user/rc/src/firewall_ex.c").read_text()
          status_helper = Path("trunk/user/rc/src/firewall_command_status.h").read_text()
          status_test = Path("trunk/user/rc/src/tests/firewall_command_status.c").read_text()
          shutils = Path("trunk/user/shared/src/shutils.c").read_text()

          # doSystem() returns system(3)'s encoded wait status, not a plain
          # shell exit code. Require every built-in and add-on restore to be
          # wrapped so failures are visible in the router log.
          assert "return system(cmd_buf);" in shutils
          assert '#include "firewall_command_status.h"' in firewall
          assert "WIFEXITED(status)" in status_helper
          assert "WEXITSTATUS(status)" in status_helper
          assert "WIFSIGNALED(status)" in status_helper
          assert "firewall_command_status_signal(SIGTERM)" in status_test
          restore_calls = re.findall(
              r'firewall_log_command_failure\("[^"]*restore",\s*doSystem\("(?:ip6tables-restore|iptables-restore)[^"]*"',
              firewall
          )
          assert len(restore_calls) == 11, len(restore_calls)
          assert not re.search(r'^\s*doSystem\("(?:ip6tables-restore|iptables-restore)', firewall, re.M)
          for call in (
              'firewall_log_command_failure("Shadowsocks firewall hook", doSystem("sh %s", shadowsocks_staged));',
              'firewall_log_command_failure("Persistent post-firewall hook", doSystem("%s", int_iptables_script));',
              'firewall_log_command_failure("Optware iptables update hook", doSystem("%s update", opt_iptables_script));',
              'firewall_log_command_failure("Adbyby iptables restore", doSystem("iptables-restore -n %s", adbyby_iptables));'
          ):
              assert call in firewall
          assert firewall.count("firewall_log_command_failure(") == 15
          print("Firewall restore and extension command failures are reported: OK")
          PY

      - name: Check root-managed executable script staging
        run: |
          set -eu
          sh -n trunk/user/scripts/files/usr/bin/ap_script.sh
          sh -n trunk/user/aliddns/aliddns.sh
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          ap = Path("trunk/user/scripts/files/usr/bin/ap_script.sh").read_text()
          aliddns = Path("trunk/user/aliddns/aliddns.sh").read_text()
          dev_init = Path("trunk/user/scripts/files/sbin/dev_init.sh").read_text()

          # The AP daemon is staged with an atomic mkdir under the private /home/root tmpfs parent.
          # The private 0700 parent prevents local replacement or modification.
          assert 'ap_auto_candidate="/home/root/.sh_apauto.$RANDOM.$ap_auto_try"' in ap
          assert 'if mkdir "$ap_auto_candidate" 2>/dev/null; then' in ap
          assert "umask 077" in ap
          assert 'ap_auto_script="$ap_auto_dir/sh_apauto.sh"' in ap
          assert 'cat > "$ap_auto_script" <<-\\EOF' in ap
          body_start_marker = 'cat > "$ap_auto_script" <<-\\EOF' + chr(10)
          body_start = ap.index(body_start_marker) + len(body_start_marker)
          body_end = ap.index(chr(10) + "EOF", body_start)
          subprocess.run(["sh", "-n"], input=ap[body_start:body_end], text=True, check=True)
          assert "trap ap_auto_cleanup EXIT" in ap
          assert 'chmod 700 "$ap_auto_script"' in ap
          assert 'chmod 777 "/tmp/sh_apauto.sh"' not in ap
          assert 'cat >/tmp/sh_apauto.sh' not in ap
          assert "/tmp/sh_apauto.sh" not in ap

          # AliDDNS's launcher lives in a private tmpfs directory.
          assert 'ALIDDNS_HELPER_DIR="/home/root/.aliddns"' in aliddns
          assert 'ALIDDNS_HELPER="$ALIDDNS_HELPER_DIR/_aliddns"' in aliddns
          assert 'export PATH="/etc/storage/bin:$ALIDDNS_HELPER_DIR:/tmp/script:' in aliddns
          assert '(umask 077; mkdir "$ALIDDNS_HELPER_DIR")' in aliddns
          assert 'chmod 700 "$ALIDDNS_HELPER_DIR"' in aliddns
          assert "printf '#!/bin/sh" in aliddns
          assert ' > "$ALIDDNS_HELPER")' in aliddns
          assert 'chmod 700 "$ALIDDNS_HELPER"' in aliddns
          assert 'kill_ps "$ALIDDNS_HELPER"' in aliddns
          assert "/tmp/script/_aliddns" not in aliddns
          assert "mount -t tmpfs tmpfs /home" in dev_init
          assert "mkdir -p -m 700 /home/root" in dev_init
          print("Root-managed AP and AliDDNS temporary executable staging: OK")
          PY

      - name: Verify HTTPD auth and route-access wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("trunk/user/httpd/src")
          httpd = (root / "httpd.c").read_text()
          web = (root / "web_ex.c").read_text()
          common = (root / "common.c").read_text()
          variables = (root / "variables.c").read_text()
          script_policy = (root / "httpd_script_policy.h").read_text()
          script_policy_test = (root / "tests/httpd_script_policy.c").read_text()
          service_id_test = (root / "tests/httpd_service_id.c").read_text()
          upload = (root / "upload.c").read_text()
          archive_root = Path("trunk/user/busybox/busybox-1.24.x/archival/libarchive")
          data_extract = (archive_root / "data_extract_all.c").read_text()
          safe_extract = (archive_root / "safe_extract_path.h").read_text()
          storage_script = Path("trunk/user/scripts/files/sbin/mtd_storage.sh").read_text()
          firewall_root = Path("trunk/user/rc/src")
          firewall = (firewall_root / "firewall_ex.c").read_text()
          vpn_server = (firewall_root / "vpn_server.c").read_text()
          firewall_policy = (firewall_root / "firewall_filter_policy.h").read_text()
          firewall_test = (firewall_root / "tests/firewall_filter_policy.c").read_text()
          firewall_rule_file = (firewall_root / "firewall_rule_file.h").read_text()
          firewall_rule_file_test = (firewall_root / "tests/firewall_rule_file.c").read_text()

          getter_start = httpd.index("get_login_private_key_access(void)")
          getter_end = httpd.index("\nstatic void\nhttp_login", getter_start)
          getter = httpd[getter_start:getter_end]
          assert "httpd_private_key_access_allowed(login_ip.len != 0, login_safe)" in getter
          assert "http_is_ssl" not in getter

          dump_start = web.index("static int\ndump_file(")
          dump_end = web.index("static int\nej_dump", dump_start)
          dump = web[dump_start:dump_end]
          assert 'get_login_private_key_access()' in dump
          assert 'strcmp(extensions, ".key") == 0' in dump

          # The Shadowsocks dbconf API returns persisted proxy-node objects.
          # It must pass through the same HTTP authentication gate as its page.
          dbconf_routes = [
              line for line in web.splitlines()
              if '"dbconf"' in line and 'do_dbconf' in line
          ]
          assert len(dbconf_routes) == 1
          assert dbconf_routes[0].rstrip().endswith("do_dbconf, 1 },")

          request_start = httpd.index("handle_request(FILE *conn_fp")
          request_end = httpd.index("reset_lang_dict(void)", request_start)
          request = httpd[request_start:request_end]
          auth_gate = request.index("if (handler->need_auth && login_state > 1")
          output_call = request.index("handler->output(file, conn_fp)")
          assert auth_gate < output_call
          assert "auth_check(authorization)" in request[auth_gate:output_call]

          # Preserve the existing HTTPS allowance for unrelated remote-admin
          # operations; the private-key policy is intentionally narrower.
          assert "if (http_is_ssl)\n\t\treturn 1;" in httpd
          # Basic credentials must use a strict, bounded and unambiguous decoder.
          basic = (root / "httpd_basic_auth.h").read_text()
          base64 = (root / "base64.c").read_text()
          makefile = (root / "Makefile").read_text()
          auth_start = httpd.index("auth_check( const char *authorization )")
          auth_end = httpd.index("\nstatic int\nmatch_one", auth_start)
          auth = httpd[auth_start:auth_end]
          assert '#include "httpd_basic_auth.h"' in httpd
          assert "httpd_decode_basic_authorization" in auth
          assert "b64_decode(" not in auth
          assert 'strncasecmp(authorization, "Basic", 5)' in basic
          assert "authorization[5] != ' '" in basic
          assert "b64_decode_strict" in basic and "b64_decode_strict" in base64
          assert "memchr(decoded," in basic
          assert "static const signed char b64_decode_table[256]" in base64
          assert "base64.o" in makefile


          # Assert the complete known HTTPD MIME auth boundary in source,
          # including feature-gated handlers. This parses the table rather
          # than depending on formatting or preprocessor configuration.
          table_start = web.index("struct mime_handler mime_handlers[] = {")
          table_end = web.index(chr(10) + "};", table_start)
          route_table = web[table_start:table_end]
          route_pattern = re.compile(
              r'^\s*\{\s*"([^"]+)"\s*,.*,\s*(do_[A-Za-z_]\w*)\s*,\s*([01])\s*\},'
          )
          routes = []
          for route_line in route_table.splitlines():
              match = route_pattern.match(route_line)
              if match:
                  routes.append((match.group(1), match.group(2), int(match.group(3))))
          assert routes, "failed to parse the HTTPD MIME route table"

          def expect_route(pattern, callback, need_auth):
              found = [route for route in routes if route[0] == pattern]
              assert len(found) == 1, f"expected exactly one route for {pattern}: {found}"
              assert found[0][1:] == (callback, need_auth), (
                  f"unexpected route policy for {pattern}: {found[0]}"
              )

          # These explicit cached assets are intentionally public and must
          # precede the protected dynamic-JavaScript catch-all.
          public_assets = {
              "jquery.js": "do_file",
              "**bootstrap.min.js": "do_file",
              "**engage.itoggle.min.js": "do_file",
              "**highcharts.js": "do_file",
              "**highcharts_theme.js": "do_file",
              "**formcontrol.js": "do_file",
              "itoggle.js": "do_file",
              "modem_isp.js": "do_file",
              "client_function.js": "do_file",
              "disk_functions.js": "do_file",
              "md5.js": "do_file",
              "**.css": "do_file",
              "**.woff": "do_file",
              "**.woff2": "do_file",
              "**.png": "do_file",
              "**.gif": "do_file",
              "**.jpg": "do_file",
              "**.ico": "do_file",
              "**.svg": "do_file",
          }
          for pattern, callback in public_assets.items():
              expect_route(pattern, callback, 0)

          dynamic_js_indices = [i for i, route in enumerate(routes) if route[0] == "**.js"]
          assert len(dynamic_js_indices) == 1, "expected one protected dynamic-JS catch-all"
          for pattern in (
              "jquery.js", "**bootstrap.min.js", "**engage.itoggle.min.js",
              "**highcharts.js", "**highcharts_theme.js", "**formcontrol.js",
              "itoggle.js", "modem_isp.js", "client_function.js",
              "disk_functions.js", "md5.js",
          ):
              explicit_index = next(i for i, route in enumerate(routes) if route[0] == pattern)
              assert explicit_index < dynamic_js_indices[0], (
                  f"public JavaScript route {pattern} is shadowed by the dynamic-JS route"
              )

          # Every dynamic page, export, config mutation, firmware/storage
          # upload/restore endpoint and feature-gated API must require auth.
          protected_routes = {
              "**.htm*": "do_ej",
              "**.asp*": "do_ej",
              "**.js": "do_ej",
              "Settings_**.CFG": "do_nvram_file",
              "Storage_**.TBZ": "do_storage_file",
              "syslog.txt": "do_syslog_file",
              "scutclient.log": "do_scutclient_log_file",
              "mentohust.log": "do_mentohust_log_file",
              "client.ovpn": "do_export_ovpn_client",
              "applydb.cgi*": "do_applydb_cgi",
              "dbconf": "do_dbconf",
              "update.cgi*": "do_update_cgi",
              "apply.cgi*": "do_apply_cgi",
              "upgrade.cgi*": "do_upgrade_fw_cgi",
              "restore_nv.cgi*": "do_restore_nv_cgi",
