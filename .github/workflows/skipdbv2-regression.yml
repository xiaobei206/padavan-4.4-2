name: SkipDBv2 Regression

on:
  push:
    paths:
      - ".github/workflows/skipdbv2-regression.yml"
      - ".github/workflows/build.yml"
      - "trunk/user/skipdbv2/skipdbv2/**"
      - "trunk/user/skipdbv2/Makefile"
      - "trunk/user/cflags.mk"
      - "trunk/Makefile"
      - "trunk/user/Makefile"
      - "trunk/libs/Makefile"
      - "trunk/configs/templates/XY-C1.config"
      - "trunk/configs/boards/XY-C1/kernel-4.4.x.config"
      - "trunk/linux-4.4.x/arch/mips/boot/dts/ralink/xy-c1.dts"
      - "trunk/linux-4.4.x/drivers/gpio/gpio-button-hotplug.c"
      - "trunk/linux-4.4.x/drivers/gpio/Makefile"
      - "trunk/user/rc/src/gpio_btn.c"
      - "trunk/user/rc/src/services.c"
  pull_request:
    paths:
      - ".github/workflows/skipdbv2-regression.yml"
      - ".github/workflows/build.yml"
      - "trunk/user/skipdbv2/skipdbv2/**"
      - "trunk/user/skipdbv2/Makefile"
      - "trunk/user/cflags.mk"
      - "trunk/Makefile"
      - "trunk/user/Makefile"
      - "trunk/libs/Makefile"
      - "trunk/configs/templates/XY-C1.config"
      - "trunk/configs/boards/XY-C1/kernel-4.4.x.config"
      - "trunk/linux-4.4.x/arch/mips/boot/dts/ralink/xy-c1.dts"
      - "trunk/linux-4.4.x/drivers/gpio/gpio-button-hotplug.c"
      - "trunk/linux-4.4.x/drivers/gpio/Makefile"
      - "trunk/user/rc/src/gpio_btn.c"
      - "trunk/user/rc/src/services.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libev-dev

      - name: Verify XY-C1 firmware integration contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          checks = {
              "trunk/configs/templates/XY-C1.config": [
                  "CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n",
                  "CONFIG_FIRMWARE_INCLUDE_SKIPDBV2=y",
              ],
              "trunk/Makefile": [
                  "$(ROOTDIR)/stage",
                  "PROJECT_CONFIG LINUX_CONFIG ROOTDIR LINUXDIR ROMFSDIR STAGEDIR",
              ],
              "trunk/user/cflags.mk": [
                  "ifneq ($(filter y,$(CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS) $(CONFIG_FIRMWARE_INCLUDE_SKIPDBV2)),)",
                  "CFLAGS += -DAPP_SKIPDBV2",
              ],
              "trunk/user/skipdbv2/Makefile": [
                  "build/$(CONFIG_CROSS_COMPILE)",
                  '-DCMAKE_TOOLCHAIN_FILE="$(CONFIG_CMAKE_TOOLCHAIN_FILE)"',
                  'LDFLAGS="$(LDFLAGS) -L$(STAGEDIR)/lib"',
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBCommitMarker.h": [
                  "UDBCommitMarker_setPath_(UDBCommitMarker *self, const char *path)",
                  "UDBCommitMarker_read(UDBCommitMarker *self)",
                  "UDBCommitMarker_verifyJournal(const char *path)",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBCommitMarker.c": [
                  "O_NOFOLLOW",
                  "O_NONBLOCK|O_CLOEXEC",
                  "after.st_uid!=geteuid()",
                  "fchmod(fd,0600)",
                  "JFile_verifyLog(&journal)",
                  "UDBCommitMarker_artifactsAreEmpty",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDB.h": [
                  '#include "UDBCommitMarker.h"',
                  "UDBCommitMarker commitMarker;",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBStorage.c": [
                  "void UDB_open(UDB *self)",
                  "UDBCommitMarker_open(&self->commitMarker,0)",
                  "UDBCommitMarker_artifactsExist(artifact_paths,4)",
                  "UDBCommitMarker_verifyJournal(self->index->file->logPath)",
                  "UDBCommitMarker_write(&self->commitMarker, 1)",
                  "UDBCommitMarker_write(&self->commitMarker,0)",
                  "UDBCommitMarker_syncParentDirectory(self->commitMarker.path)",
                  "void UDB_commitTransaction(UDB *self)",
                  "static int UDB_streamsOpen(UDB *self)",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBCompact.c": [
                  "int UDB_compactStepFor_(UDB *self, double maxSeconds)",
                  "UDBRecord_totalSize(record) > UDBRecord_totalSize(firstEmptyRecord)",
                  "UDBRecords_truncate_(self->records, (off_t)tail_pos)",
              ],
              "trunk/user/skipdbv2/skipdbv2/tests/udb_reserved_pid.c": [
                  "UDBCommitMarker_write(&db->commitMarker, 1)",
                  "UDB_compactStep(db)",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDB.c": [
                  "static int UDB_rollbackJournalAppend(JFile *file, long log_start,",
                  "static int UDB_append_withPid_(UDB *self, Datum d, PID_TYPE pid)",
                  "PID_TYPE UDB_put_(UDB *self, Datum d)",
                  "void UDB_at_put_(UDB *self, PID_TYPE pid, Datum d)",
              ],
              "trunk/user/skipdbv2/skipdbv2/tests/commit_marker.c": [
                  "UDBCommitMarker_write(&marker,0)",
                  "UDBCommitMarker_write(&marker,1)",
                  "symlink followed",
                  "complete journal rejected",
                  "incomplete journal accepted",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/ipc_io.h": [
                  "static int skipdb_monotonic_milliseconds(",
                  "clock_gettime(CLOCK_MONOTONIC, &ts)",
                  "skipdb_monotonic_milliseconds(&now)",
                  "static int skipdb_wait_socket_until(int fd, short events,",
                  "poll(&pfd, 1, poll_timeout)",
                  "if (result < 0 && errno == EINTR)",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/dbus.c": [
                  '#include "ipc_io.h"',
                  "skipdb_monotonic_milliseconds(&now)",
                  "skipdb_wait_socket_until(client->remote_fd, POLLIN, timeout)",
                  "skipdb_wait_socket_until(client->remote_fd, POLLOUT, timeout)",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/dbapi.c": [
                  '#include "ipc_io.h"',
                  "skipdb_monotonic_milliseconds(&now)",
                  "skipdb_wait_socket_until(client->remote_fd, POLLIN, timeout)",
                  "skipdb_wait_socket_until(client->remote_fd, POLLOUT, timeout)",
              ],
              "trunk/user/skipdbv2/skipdbv2/CMakeLists.txt": [
                  "SET(UDB_SRC",
                  "UDBStorage.c",
                  "UDBCompact.c",
                  "ADD_EXECUTABLE(commit_marker_test",
                  "add_test(NAME commit_marker_test COMMAND commit_marker_test)",
                  "ADD_EXECUTABLE(ipc_io_test",
                  "add_test(NAME ipc_io_test COMMAND ipc_io_test)",
              ],
              "trunk/user/skipdbv2/skipdbv2/tests/ipc_io.c": [
                  "skipdb_wait_socket_until(sockets[0], POLLIN, now + 10ULL)",
                  "skipdb_wait_socket_until(sockets[0], POLLIN, now + 1000ULL)",
                  "skipdb_wait_socket_until(sockets[0], POLLOUT, now + 1000ULL)",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/skipd.c": [
                  "O_NOFOLLOW",
                  "st_nlink != 1",
                  "fchmod(fd, 0600)",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/daemonize.c": [
                  "O_NOFOLLOW",
                  "st_nlink != 1",
                  "ftruncate(fd, 0)",
              ],
              "trunk/user/Makefile": [
                  "ifneq ($(filter y,$(CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS) $(CONFIG_FIRMWARE_INCLUDE_SKIPDBV2)),)",
                  "dir_y += skipdbv2",
              ],
              "trunk/libs/Makefile": [
                  "ifeq ($(CONFIG_FIRMWARE_INCLUDE_SKIPDBV2),y)",
                  "LIBS_INCLUDE_LIBEV=y",
              ],
              "trunk/user/rc/src/services.c": [
                  "#if defined(APP_SKIPDBV2)",
                  'doSystem("/usr/sbin/skipd -d /etc/storage/db");',
                  "#endif",
                  "start_gpio_btn();",
              ],
              "trunk/linux-4.4.x/arch/mips/boot/dts/ralink/xy-c1.dts": [
                  'compatible = "gpio-keys-polled";',
                  "gpios = <&gpio0 18 GPIO_ACTIVE_LOW>;",
                  "linux,code = <KEY_RESTART>;",
              ],
              "trunk/linux-4.4.x/drivers/gpio/Makefile": [
                  "obj-y += gpio-button-hotplug.o",
              ],
              "trunk/linux-4.4.x/drivers/gpio/gpio-button-hotplug.c": [
                  '"gpio-keys-polled"',
                  '"ACTION=%s"',
                  '"BUTTON=%s"',
              ],
              "trunk/configs/boards/XY-C1/kernel-4.4.x.config": [
                  "CONFIG_GPIOLIB=y",
                  "# CONFIG_INPUT is not set",
              ],
              "trunk/user/rc/src/gpio_btn.c": [
                  "NETLINK_KOBJECT_UEVENT",
                  'strcmp(value, "pressed")',
                  'strcmp(value, "released")',
                  'memcmp(field, "BUTTON",',
                  "static volatile sig_atomic_t running = 1;",
                  "memset(&btn_ev, 0, sizeof(btn_ev));\n\t\t\tnlmsg_handle(buf, msglen, &btn_ev);",
                  "CLOCK_MONOTONIC",
                  "btn_update_press_count(btn);",
                  "btn_hold_tick();",
              ],
          }

          build_workflow = Path(".github/workflows/build.yml").read_text()
          if re.search(r"(?m)^  watch:\s*$", build_workflow):
              raise SystemExit("release-capable Build Firmware workflow must not accept public watch events")
          if not re.search(r"(?m)^  workflow_dispatch:\s*$", build_workflow):
              raise SystemExit("Build Firmware must retain its authorized manual trigger")

          for path, needles in checks.items():
              content = Path(path).read_text()
              for needle in needles:
                  if needle not in content:
                      raise SystemExit(f"missing XY-C1 integration contract: {path}: {needle}")
              print(f"OK: {path}")

          user_makefile = Path("trunk/user/Makefile").read_text()
          if "dir_$(CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS)\t+= skipdbv2" in user_makefile:
              raise SystemExit("SkipDBv2 is still tied exclusively to Shadowsocks")

          for path in (
              "trunk/user/skipdbv2/skipdbv2/mgr/ipc_io.h",
              "trunk/user/skipdbv2/skipdbv2/mgr/dbus.c",
              "trunk/user/skipdbv2/skipdbv2/mgr/dbapi.c",
          ):
              content = Path(path).read_text()
              if "gettimeofday(&tv2, NULL)" in content:
                  raise SystemExit(f"wall-clock IPC timeout remains: {path}")
              if "usleep(5);" in content or "usleep(50);" in content:
                  raise SystemExit(f"busy-poll IPC retry remains: {path}")

          print("XY-C1 SkipDBv2 and GPIO hotplug integration contracts passed.")
          PY


      - name: Configure
        run: |
          cmake -S trunk/user/skipdbv2/skipdbv2 -B build/skipdbv2 \
            -DSKIPDB_BUILD_TESTS=ON

      - name: Build all SkipDBv2 targets
        run: cmake --build build/skipdbv2 --parallel 2

      - name: Run regression tests
        run: ctest --test-dir build/skipdbv2 --output-on-failure
