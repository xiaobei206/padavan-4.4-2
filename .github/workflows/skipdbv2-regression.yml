                  "skipdb_wait_socket_until(fd, POLLOUT, timeout)",
                  "MSG_NOSIGNAL",
                  "O_NONBLOCK",
              ],
              "trunk/user/skipdbv2/skipdbv2/tests/ipc_transport.c": [
                  "test_validation_and_buffer",
                  "test_unix_connect",
                  "test_nonblocking_and_write",
                  "test_read_success_eof_and_timeout",
              ],
              "trunk/user/skipdbv2/skipdbv2/CMakeLists.txt": [
                  "SET(JFILE_SRC",
                  "${PROJECT_SOURCE_DIR}/jfile/JFile.c",
                  "${PROJECT_SOURCE_DIR}/jfile/JFileJournal.c",
                  "${PROJECT_SOURCE_DIR}/jfile/JFileJournalScan.c",
                  "${PROJECT_SOURCE_DIR}/jfile/JFileSync.c",
                  "${PROJECT_SOURCE_DIR}/skipdb/SkipDBRecordCache.c",
                  "${PROJECT_SOURCE_DIR}/skipdb/SkipDBRecordLinks.c",
                  "${PROJECT_SOURCE_DIR}/skipdb/SkipDBRecordStorage.c",
                  "skipdb_record_storage_test",
                  "add_test(NAME skipdb_record_storage_test COMMAND skipdb_record_storage_test)",
                  "ADD_LIBRARY(skipdb STATIC ${BASEKIT_SRC} ${JFILE_SRC} ${UDB_SRC} ${SKIPDB_SRC})",
                  "jfile_journal_test",
                  "add_test(NAME jfile_journal_test COMMAND jfile_journal_test)",

                  "SET(UDB_SRC",
                  "UDBRead.c",
                  "UDBRecordWrite.c",
                  "UDBRecordRead.c",
                  "UDBRecordMove.c",
                  "UDBWrite.c",
                  "UDBLifecycle.c",
                  "UDBRecovery.c",
                  "UDBTransaction.c",
                  "UDBCompact.c",
                  "UDBRecordsStorage.c",
                  "UDBRecordsCursor.c",
                  "UDBRecordsFreeList.c",
                  "UDBIndexFreeList.c",
                  "UDBIndexMap.c",
                  "udb_index_layers_test",
                  "add_test(NAME udb_index_layers_test COMMAND udb_index_layers_test)",
                  "ADD_EXECUTABLE(udb_record_api_test",
                  "add_test(NAME udb_record_api_test COMMAND udb_record_api_test)",
                  "udb_record_storage_test",
                  "add_test(NAME udb_record_storage_test COMMAND udb_record_storage_test)",
                  "udb_transaction_lifecycle_test",
                  "add_test(NAME udb_transaction_lifecycle_test COMMAND udb_transaction_lifecycle_test)",
                  "ADD_EXECUTABLE(commit_marker_test",
                  "add_test(NAME commit_marker_test COMMAND commit_marker_test)",
                  "ADD_EXECUTABLE(ipc_io_test",
                  "add_test(NAME ipc_io_test COMMAND ipc_io_test)",
                  "ADD_EXECUTABLE(ipc_transport_test",
                  "add_test(NAME ipc_transport_test COMMAND ipc_transport_test)",
                  "ADD_EXECUTABLE(ipc_protocol_test",
                  "add_test(NAME ipc_protocol_test COMMAND ipc_protocol_test)",
                  "mgr/dbus_result.c",
                  "mgr/ipc_protocol.c",
                  "mgr/ipc_transport.c",
              ],
              "trunk/user/skipdbv2/skipdbv2/tests/ipc_io.c": [
                  "skipdb_wait_socket_until(sockets[0], POLLIN, now + 10ULL)",
                  "skipdb_wait_socket_until(sockets[0], POLLIN, now + 1000ULL)",
                  "skipdb_wait_socket_until(sockets[0], POLLOUT, now + 1000ULL)",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/skipd.c": [
                  "O_NOFOLLOW",
                  "st_nlink != 1",
                  "fchmod(fd, 0600)",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/daemonize.c": [
                  "O_NOFOLLOW",
                  "st_nlink != 1",
                  "ftruncate(fd, 0)",
              ],
              "trunk/user/Makefile": [
                  "ifneq ($(filter y,$(CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS) $(CONFIG_FIRMWARE_INCLUDE_SKIPDBV2)),)",
                  "dir_y += skipdbv2",
              ],
              "trunk/libs/Makefile": [
                  "ifeq ($(CONFIG_FIRMWARE_INCLUDE_SKIPDBV2),y)",
                  "LIBS_INCLUDE_LIBEV=y",
              ],
              "trunk/user/rc/src/services.c": [
                  "#if defined(APP_SKIPDBV2)",
                  'doSystem("/usr/sbin/skipd -d /etc/storage/db");',
                  "#endif",
                  "start_gpio_btn();",
              ],
              "trunk/linux-4.4.x/arch/mips/boot/dts/ralink/xy-c1.dts": [
                  'compatible = "gpio-keys-polled";',
                  "gpios = <&gpio0 18 GPIO_ACTIVE_LOW>;",
                  "linux,code = <KEY_RESTART>;",
              ],
              "trunk/linux-4.4.x/drivers/gpio/Makefile": [
                  "obj-y += gpio-button-hotplug.o",
              ],
              "trunk/linux-4.4.x/drivers/gpio/gpio-button-hotplug.c": [
                  '"gpio-keys-polled"',
                  '"ACTION=%s"',
                  '"BUTTON=%s"',
              ],
              "trunk/configs/boards/XY-C1/kernel-4.4.x.config": [
                  "CONFIG_GPIOLIB=y",
                  "# CONFIG_INPUT is not set",
              ],
              "trunk/user/rc/src/gpio_btn.c": [
                  "NETLINK_KOBJECT_UEVENT",
                  'strcmp(value, "pressed")',
                  'strcmp(value, "released")',
                  'memcmp(field, "BUTTON",',
                  "static volatile sig_atomic_t running = 1;",
                  "memset(&btn_ev, 0, sizeof(btn_ev));\n\t\t\tnlmsg_handle(buf, msglen, &btn_ev);",
                  "CLOCK_MONOTONIC",
                  "btn_update_press_count(btn);",
                  "btn_hold_tick();",
              ],
          }

          build_workflow = Path(".github/workflows/build.yml").read_text()
          if re.search(r"(?m)^  watch:\s*$", build_workflow):
              raise SystemExit("release-capable Build Firmware workflow must not accept public watch events")
          if not re.search(r"(?m)^  workflow_dispatch:\s*$", build_workflow):
              raise SystemExit("Build Firmware must retain its authorized manual trigger")

          for path, needles in checks.items():
              content = Path(path).read_text()
              for needle in needles:
                  if needle not in content:
                      raise SystemExit(f"missing XY-C1 integration contract: {path}: {needle}")
              print(f"OK: {path}")

          user_makefile = Path("trunk/user/Makefile").read_text()
          if "dir_$(CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS)\t+= skipdbv2" in user_makefile:
              raise SystemExit("SkipDBv2 is still tied exclusively to Shadowsocks")

          for path in (
              "trunk/user/skipdbv2/skipdbv2/mgr/ipc_io.h",
              "trunk/user/skipdbv2/skipdbv2/mgr/dbus.c",
              "trunk/user/skipdbv2/skipdbv2/mgr/dbapi.c",
              "trunk/user/skipdbv2/skipdbv2/mgr/ipc_transport.c",
          ):
              content = Path(path).read_text()
              if "gettimeofday(&tv2, NULL)" in content:
                  raise SystemExit(f"wall-clock IPC timeout remains: {path}")
              if "usleep(5);" in content or "usleep(50);" in content:
                  raise SystemExit(f"busy-poll IPC retry remains: {path}")


          udb_record_core = Path("trunk/user/skipdbv2/skipdbv2/udb/UDBRecord.c").read_text()
          for moved_definition in (
              "UDBRecord_saveWithDatum_(",
              "UDBRecord_readHeader(",
              "UDBRecord_moveToPos_(",
          ):
              if moved_definition in udb_record_core:
                  raise SystemExit("UDBRecord core still owns extracted function: " + moved_definition)

          udb_root = Path("trunk/user/skipdbv2/skipdbv2/udb")
          if (udb_root / "UDBStorage.c").exists():
              raise SystemExit("UDBStorage.c must remain decomposed into lifecycle/recovery/transaction units")

          for module, forbidden in (
              ("UDBLifecycle.c", ("UDB_open(", "UDB_beginTransaction(", "UDB_commitTransaction(")),
              ("UDBRecovery.c", ("UDB_new(", "UDB_setPath_(", "UDB_commitTransaction(")),
              ("UDBTransaction.c", ("UDB_open(", "UDB_setPath_(", "UDB_free(")),
          ):
              content = (udb_root / module).read_text()
              for symbol in forbidden:
                  if symbol in content:
                      raise SystemExit(f"cross-layer ownership leak in {module}: {symbol}")

          record_header = (udb_root / "UDBRecord.h").read_text()
          if "UArray *UDBRecord_data(UDBRecord *self);" not in record_header:
              raise SystemExit("UDBRecord lazy-data accessor is missing from its shared header")

          record_core = Path("trunk/user/skipdbv2/skipdbv2/skipdb/SkipDBRecord.c").read_text()
          for moved_definition in (
              "SkipDBRecord_toStream_(",
              "SkipDBRecord_fromStream_(",
              "SkipDBRecord_find_quick_(",
              "SkipDBRecord_removeReferencesToUnmarked(",
          ):
              if moved_definition in record_core:
                  raise SystemExit("SkipDBRecord core still owns extracted function: " + moved_definition)


          # Keep skipd's runtime ownership boundaries explicit: its executable
          # must link every independently compiled subsystem, not include a
          # monolithic implementation or silently omit a module.
          manager_root = Path("trunk/user/skipdbv2/skipdbv2/mgr")
          manager_contracts = {
              "skipd.c": [
                  '#include "skipd_internal.h"',
                  "static void client_read_inner(",
                  "static void server_cb(",
                  "int main(int argc, char **argv)",
              ],
              "skipd_internal.h": [
                  "typedef struct _skipd_server",
                  "typedef struct _skipd_client",
                  "int client_ccr_process(EV_P_ skipd_client *client);",
                  "void server_sync(EV_P_ skipd_server *server);",
                  "void unix_socket_release_instance_lock(void);",
              ],
              "skipd_command.c": [
                  "static int client_run_command(",
                  "int client_ccr_process(",
                  "client_ccr_read_util(",
              ],
              "skipd_database.c": [
                  "static int read_db_switch_marker(",
                  "int server_init(",
                  "void server_switch(",
                  "unix_socket_release_instance_lock();",
              ],
              "skipd_scheduler.c": [
                  "void delay_cmd_cb(",
                  "void server_init_delay(",
                  "void server_init_time(",
                  "void server_sync_tick(",
              ],
              "skipd_socket.c": [
                  "static int socket_instance_lock_fd = -1;",
                  "int unix_socket_init(",
                  "void unix_socket_release_instance_lock(void)",
              ],
          }
          for module, needles in manager_contracts.items():
              content = (manager_root / module).read_text()
              for needle in needles:
                  if needle not in content:
                      raise SystemExit(f"skipd ownership contract missing: {module}: {needle}")

          if "static int client_run_command(" in (manager_root / "skipd.c").read_text():
              raise SystemExit("skipd command engine remains in the event-loop facade")
          if "int unix_socket_init(" in (manager_root / "skipd.c").read_text():
              raise SystemExit("skipd socket engine remains in the event-loop facade")
          cmake_text = Path("trunk/user/skipdbv2/skipdbv2/CMakeLists.txt").read_text()
          for module in ("skipd_command.c", "skipd_database.c",
                         "skipd_scheduler.c", "skipd_socket.c"):
              if f"mgr/{module}" not in cmake_text:
                  raise SystemExit(f"skipd module missing from executable source list: {module}")

          udb_record_core = Path("trunk/user/skipdbv2/skipdbv2/udb/UDBRecord.c").read_text()
          udb_record_write = Path("trunk/user/skipdbv2/skipdbv2/udb/UDBRecordWrite.c").read_text()
          if "int UDBRecord_isEmpty(" not in udb_record_core:
              raise SystemExit("UDBRecord emptiness predicate lost its metadata owner")
          if "UDBRecord_isEmpty(" in udb_record_write:
              raise SystemExit("UDBRecord emptiness predicate has multiple implementation owners")

          if cmake_text.count("mgr/ipc_protocol.c") < 5:
              raise SystemExit("IPC protocol parser is not linked by both CLIs and every protocol test")

          if cmake_text.count("mgr/dbus_result.c") != 2:
              raise SystemExit("DBus result module is not linked by the CLI and protocol regression")
          dbus_cli_text = (manager_root / "dbus.c").read_text()
          dbus_result_text = (manager_root / "dbus_result.c").read_text()
          if "int parse_script_result(dbclient *client)" in dbus_cli_text:
              raise SystemExit("DBus result parser remains in the CLI facade")
          if "int parse_script_result(dbclient *client)" not in dbus_result_text:
              raise SystemExit("DBus result module lost script-result ownership")

          print("XY-C1 SkipDBv2 and GPIO hotplug integration contracts passed.")
          PY


      - name: Configure
        run: |
          cmake -S trunk/user/skipdbv2/skipdbv2 -B build/skipdbv2 \
            -DSKIPDB_BUILD_TESTS=ON

      - name: Build all SkipDBv2 targets
        run: cmake --build build/skipdbv2 --parallel 2

      - name: Run regression tests
        run: ctest --test-dir build/skipdbv2 --output-on-failure
