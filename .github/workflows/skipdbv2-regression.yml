              "trunk/user/skipdbv2/skipdbv2/udb/UDBLifecycle.c": [
                  "UDB *UDB_new(void)",
                  "void UDB_free(UDB *self)",
                  "void UDB_delete(UDB *self)",
                  "void UDB_setPath_(UDB *self, const char *path)",
