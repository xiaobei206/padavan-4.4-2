              "TARGET_INCLUDE_DIRECTORIES(skipd_script_test PRIVATE ${PROJECT_SOURCE_DIR}/mgr)" not in script_target
          ):
              raise SystemExit("skipd script safety test must link the implementation and expose its private header")
          if cmake_text.count("mgr/skipd_script.c") != 2:
              raise SystemExit("skipd script module is not linked exactly once in production and once in its regression")

          if cmake_text.count("mgr/skipd_client.c") != 1:
              raise SystemExit("skipd client lifecycle module is not linked exactly once")
          for module in ("skipd_command.c", "skipd_client.c", "skipd_database.c",
                         "skipd_scheduler.c", "skipd_socket.c", "skipd_script.c"):
              if f"mgr/{module}" not in cmake_text:
                  raise SystemExit(f"skipd module missing from executable source list: {module}")

          udb_record_core = Path("trunk/user/skipdbv2/skipdbv2/udb/UDBRecord.c").read_text()
          udb_record_write = Path("trunk/user/skipdbv2/skipdbv2/udb/UDBRecordWrite.c").read_text()
          if "int UDBRecord_isEmpty(" not in udb_record_core:
              raise SystemExit("UDBRecord emptiness predicate lost its metadata owner")
          if "UDBRecord_isEmpty(" in udb_record_write:
              raise SystemExit("UDBRecord emptiness predicate has multiple implementation owners")

          if cmake_text.count("mgr/ipc_protocol.c") < 5:
              raise SystemExit("IPC protocol parser is not linked by both CLIs and every protocol test")

          if cmake_text.count("mgr/dbus_result.c") != 2:
              raise SystemExit("DBus result module is not linked by the CLI and protocol regression")
          dbus_cli_text = (manager_root / "dbus.c").read_text()
          dbus_result_text = (manager_root / "dbus_result.c").read_text()
          if "int parse_script_result(dbclient *client)" in dbus_cli_text:
              raise SystemExit("DBus result parser remains in the CLI facade")
          if "int parse_script_result(dbclient *client)" not in dbus_result_text:
              raise SystemExit("DBus result module lost script-result ownership")

          if cmake_text.count("mgr/dbapi_result.c") != 2:
              raise SystemExit("DBAPI result module is not linked by the CLI and protocol regression")
          dbapi_cli_text = (manager_root / "dbapi.c").read_text()
          dbapi_result_text = (manager_root / "dbapi_result.c").read_text()
          if "static int parse_list_result(" in dbapi_cli_text:
              raise SystemExit("DBAPI list parser remains in the CLI facade")
          if "int dbapi_parse_list_result(" not in dbapi_result_text:
              raise SystemExit("DBAPI result module lost list-result ownership")
          if "static int ignore_result(" in dbapi_cli_text:
              raise SystemExit("DBAPI write-response parser remains in the CLI facade")

          if cmake_text.count("mgr/ipc_request.c") != 5:
              raise SystemExit("IPC request formatter is not linked by both CLIs, both protocol fixtures, and its unit test")
          if "add_test(NAME ipc_request_test COMMAND ipc_request_test)" not in cmake_text:
              raise SystemExit("IPC request-frame regression is not registered")
          for protocol_target in ("dbus_protocol_test", "dbapi_protocol_test"):
              target_start = cmake_text.find(f"ADD_EXECUTABLE({protocol_target}")
              target_end = cmake_text.find("add_test(", target_start)
              if target_start < 0 or target_end < 0 or \
                 "mgr/ipc_request.c" not in cmake_text[target_start:target_end]:
                  raise SystemExit(f"{protocol_target} is missing the shared IPC request formatter")
          request_header_text = (manager_root / "ipc_request.h").read_text()
          request_impl_text = (manager_root / "ipc_request.c").read_text()
          request_test_text = Path("trunk/user/skipdbv2/skipdbv2/tests/ipc_request.c").read_text()
          for request_source in (dbus_cli_text, dbapi_cli_text):
              if "skipdb_ipc_format_request(" not in request_source:
                  raise SystemExit("a CLI is not using the shared IPC request formatter")
              if "%s%07" in request_source:
                  raise SystemExit("a CLI still owns duplicate IPC request-header formatting")
          if "skipdb_ipc_finalize_request(" not in dbus_cli_text:
              raise SystemExit("DBus manual request assembly bypasses the shared finalizer")
          if "int skipdb_ipc_finalize_request(" not in request_header_text or \
             "int skipdb_ipc_format_request(" not in request_header_text:
              raise SystemExit("IPC request module declarations are incomplete")
          if "int skipdb_ipc_finalize_request(" not in request_impl_text or \
             "int skipdb_ipc_format_request(" not in request_impl_text:
              raise SystemExit("IPC request implementation ownership is incomplete")
          if "skipdb_ipc_format_request(" not in request_test_text:
              raise SystemExit("IPC request-frame regression cases are missing")

          print("XY-C1 SkipDBv2 and GPIO hotplug integration contracts passed.")
          PY


      - name: Configure
        run: |
          cmake -S trunk/user/skipdbv2/skipdbv2 -B build/skipdbv2 \
            -DSKIPDB_BUILD_TESTS=ON

      - name: Build all SkipDBv2 targets
        run: cmake --build build/skipdbv2 --parallel 2

      - name: Run regression tests
        run: ctest --test-dir build/skipdbv2 --output-on-failure
