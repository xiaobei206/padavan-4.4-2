name: SkipDBv2 Regression

on:
  push:
    paths:
      - ".github/workflows/skipdbv2-regression.yml"
      - ".github/workflows/build.yml"
      - "trunk/user/skipdbv2/skipdbv2/**"
      - "trunk/user/skipdbv2/Makefile"
      - "trunk/user/cflags.mk"
      - "trunk/Makefile"
      - "trunk/user/Makefile"
      - "trunk/libs/Makefile"
      - "trunk/configs/templates/XY-C1.config"
      - "trunk/configs/boards/XY-C1/kernel-4.4.x.config"
      - "trunk/linux-4.4.x/arch/mips/boot/dts/ralink/xy-c1.dts"
      - "trunk/linux-4.4.x/drivers/gpio/gpio-button-hotplug.c"
      - "trunk/linux-4.4.x/drivers/gpio/Makefile"
      - "trunk/user/rc/src/gpio_btn.c"
      - "trunk/user/rc/src/services.c"
  pull_request:
    paths:
      - ".github/workflows/skipdbv2-regression.yml"
      - ".github/workflows/build.yml"
      - "trunk/user/skipdbv2/skipdbv2/**"
      - "trunk/user/skipdbv2/Makefile"
      - "trunk/user/cflags.mk"
      - "trunk/Makefile"
      - "trunk/user/Makefile"
      - "trunk/libs/Makefile"
      - "trunk/configs/templates/XY-C1.config"
      - "trunk/configs/boards/XY-C1/kernel-4.4.x.config"
      - "trunk/linux-4.4.x/arch/mips/boot/dts/ralink/xy-c1.dts"
      - "trunk/linux-4.4.x/drivers/gpio/gpio-button-hotplug.c"
      - "trunk/linux-4.4.x/drivers/gpio/Makefile"
      - "trunk/user/rc/src/gpio_btn.c"
      - "trunk/user/rc/src/services.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libev-dev

      - name: Verify XY-C1 firmware integration contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          checks = {
              "trunk/configs/templates/XY-C1.config": [
                  "CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n",
                  "CONFIG_FIRMWARE_INCLUDE_SKIPDBV2=y",
              ],
              "trunk/Makefile": [
                  "$(ROOTDIR)/stage",
                  "PROJECT_CONFIG LINUX_CONFIG ROOTDIR LINUXDIR ROMFSDIR STAGEDIR",
              ],
              "trunk/user/cflags.mk": [
                  "ifneq ($(filter y,$(CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS) $(CONFIG_FIRMWARE_INCLUDE_SKIPDBV2)),)",
                  "CFLAGS += -DAPP_SKIPDBV2",
              ],
              "trunk/user/skipdbv2/Makefile": [
                  "build/$(CONFIG_CROSS_COMPILE)",
                  '-DCMAKE_TOOLCHAIN_FILE="$(CONFIG_CMAKE_TOOLCHAIN_FILE)"',
                  'LDFLAGS="$(LDFLAGS) -L$(STAGEDIR)/lib"',
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBCommitMarker.h": [
                  "UDBCommitMarker_setPath_(UDBCommitMarker *self, const char *path)",
                  "UDBCommitMarker_read(UDBCommitMarker *self)",
                  "UDBCommitMarker_verifyJournal(const char *path)",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBCommitMarker.c": [
                  "O_NOFOLLOW",
                  "O_NONBLOCK|O_CLOEXEC",
                  "after.st_uid!=geteuid()",
                  "fchmod(fd,0600)",
                  "JFile_verifyLog(&journal)",
                  "UDBCommitMarker_artifactsAreEmpty",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDB.h": [
                  '#include "UDBCommitMarker.h"',
                  "UDBCommitMarker commitMarker;",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBStorage.c": [
                  '#include "UDBInternal.h"',
                  "memcpy(marker_path + n, \".committed\", sizeof(\".committed\"))",
                  "UDBCommitMarker_setPath_(&self->commitMarker, marker_path)",
                  "void UDB_open(UDB *self)",
                  "UDBCommitMarker_open(&self->commitMarker,0)",
                  "UDBCommitMarker_artifactsExist(artifact_paths,4)",
                  "UDBCommitMarker_verifyJournal(self->index->file->logPath)",
                  "UDBCommitMarker_write(&self->commitMarker, 1)",
                  "UDBCommitMarker_write(&self->commitMarker, 0)",
                  "UDBCommitMarker_syncParentDirectory(self->commitMarker.path)",
                  "void UDB_commitTransaction(UDB *self)",
                  "static int UDB_streamsOpen(UDB *self)",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBIndexInternal.h": [
                  "int UDBIndex_isValid_(UDBIndex *self);",
                  "int UDBIndex_hasStreams_(UDBIndex *self);",
                  "int UDBIndex_reservePid_(UDBIndex *self, PID_TYPE pid);",
                  "int UDBIndex_releasePid_(UDBIndex *self, PID_TYPE pid);",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBIndex.c": [
                  '#include "UDBIndexInternal.h"',
                  "int UDBIndex_isValid_(UDBIndex *self)",
                  "int UDBIndex_hasFile_(UDBIndex *self)",
                  "int UDBIndex_hasStreams_(UDBIndex *self)",
                  "int UDBIndex_finishOpening(UDBIndex *self)",
                  "void UDBIndex_commit(UDBIndex *self)",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBIndexFreeList.c": [
                  "int UDBIndex_prepareCommit(UDBIndex *self)",
                  "int UDBIndex_findHoles(UDBIndex *self)",
                  "PID_TYPE UDBIndex_allocPid(UDBIndex *self)",
                  "int UDBIndex_isReservedPid_(UDBIndex *self, PID_TYPE pid)",
                  "UDBIndex_removeHole_(self, pid);",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBIndexMap.c": [
                  "PID_TYPE UDBIndex_posForPid_(UDBIndex *self, PID_TYPE pid)",
                  "int UDBIndex_setPos_forPid_(UDBIndex *self, PID_TYPE pos, PID_TYPE pid)",
                  "UDBIndex_releasePid_(self, pid)",
                  "UDBIndex_forgetPid_(self, pid)",
                  "file_size - offset < sizeof(UDBIndexEntry)",
              ],
              "trunk/user/skipdbv2/skipdbv2/tests/udb_index_layers.c": [
                  "UDBIndex_isReservedPid_(db->index, first)",
                  "UDBIndex_nextPid(db->index) != first",
                  "UDBIndex_nextPid(db->index) != 3",
                  "index state did not survive a rebuild on reopen",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBRecords.c": [
                  "UDBRecords *UDBRecords_new(void)",
                  "void UDBRecords_free(UDBRecords *self)",
                  "void UDBRecords_setPath_(UDBRecords *self, const char *path)",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBRecordsStorage.c": [
                  "void UDBRecords_open(UDBRecords *self)",
                  "int UDBRecords_finishOpening(UDBRecords *self)",
                  "void UDBRecords_commit(UDBRecords *self)",
                  "int UDBRecords_truncate_(UDBRecords *self, off_t size)",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBRecordsCursor.c": [
                  "UDBRecord *UDBRecords_recordAtPos_(UDBRecords *self, PID_TYPE pos)",
                  "UDBRecord *UDBRecords_nextRecord(UDBRecords *self)",
                  "int UDBRecords_removeRecord_(UDBRecords *self, UDBRecord *record)",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBRecordsFreeList.c": [
                  "UDBRecord *UDBRecords_findFirstEmptyRecord(UDBRecords *self)",
                  "PID_TYPE UDBRecords_firstEmptyRecordPos(UDBRecords *self)",
                  "int UDBRecords_firstEmptyRecordPos_(UDBRecords *self, PID_TYPE pos)",
                  "UDBRecord *UDBRecords_firstEmptyRecord(UDBRecords *self)",
              ],
              "trunk/user/skipdbv2/skipdbv2/jfile/JFileInternal.h": [
                  "#define JFILE_END_TRANSACTION_ITEM 1",
                  "typedef struct JFileJournalScan",
                  "int JFileJournal_scan_(JFile *self, JFileJournalScan *scan);",
                  "int JFile_truncateLogTo_(JFile *self, long size);",
                  "FILE *JFile_openManagedFile_(const char *path, int *created);",
                  "void JFile_writeLogToFile(JFile *self);",
              ],
              "trunk/user/skipdbv2/skipdbv2/jfile/JFile.c": [
                  '#include "JFileInternal.h"',
                  "FILE *JFile_openManagedFile_(const char *path, int *created)",
                  "JFile_clipLogToLastCompletedTransaction(self);",
                  "JFile_writeLogToFile(self);",
              ],
              "trunk/user/skipdbv2/skipdbv2/jfile/JFileJournal.c": [
                  "static int JFile_applyLogToFile_(JFile *self, int clear_log)",
                  "JFileJournalScan scan;",
                  "JFileJournal_scan_(self, &scan)",
                  "scan.committedEnd != scan.logEnd",
                  "int JFile_applyLogToFile(JFile *self)",
                  "long JFile_lastCommitPosition(JFile *self)",
                  "int JFile_verifyLog(JFile *self)",
                  "void JFile_clipLogToLastCompletedTransaction(JFile *self)",
              ],
              "trunk/user/skipdbv2/skipdbv2/jfile/JFileJournalScan.c": [
                  "int JFileJournal_scan_(JFile *self, JFileJournalScan *scan)",
                  "const size_t header_size = sizeof(long) + sizeof(size_t);",
                  "remaining < (long)(header_size + 1)",
                  "scan->committedEnd = cursor",
                  "scan->validEnd = cursor",
              ],
              "trunk/user/skipdbv2/skipdbv2/jfile/JFileSync.c": [
                  "int JFile_hardSyncFileDescriptor_(JFile *self, int fd)",
                  "int JFile_truncateLogTo_(JFile *self, long size)",
                  "ftruncate(fd, target)",
                  "JFile_hardSyncFileDescriptor_(self, fd)",
                  "void JFile_syncLogWritesToDisk(JFile *self)",
                  "int JFile_clipLog(JFile *self)",
                  "void JFile_truncate_(JFile *self, off_t size)",
              ],
              "trunk/user/skipdbv2/skipdbv2/tests/jfile_journal.c": [
                  "append_crash_tail(file->logPath)",
                  "JFile_lastCommitPosition(file) != committed_log_end",
                  "JFile_verifyLog(file)",
                  "JFile_applyLogToFile(file)",
                  "JFile_clipLog(file)",
                  "JFile_close(file);",
                  "JFile_open(file);",
                  "JFile_logSize(file)",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBCompact.c": [
                  "int UDB_compactStepFor_(UDB *self, double maxSeconds)",
                  "UDBRecord_totalSize(record) > UDBRecord_totalSize(firstEmptyRecord)",
                  "UDBRecords_truncate_(self->records, (off_t)tail_pos)",
              ],
              "trunk/user/skipdbv2/skipdbv2/tests/udb_reserved_pid.c": [
                  "UDBCommitMarker_write(&db->commitMarker, 1)",
                  "UDB_compactStep(db)",
              ],
              "trunk/user/skipdbv2/skipdbv2/tests/udb_record_api.c": [
                  "invalid.size = 1",
                  "UDB_put_(db, invalid)",
                  "UDB_at_put_(db, pid",
                  "UDB_removeAt_(db, pid)",
                  "removed record reappeared after reopen",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDB.c": [
                  "PID_TYPE UDB_nextPid(UDB *self)",
                  "PID_TYPE UDB_allocPid(UDB *self)",
                  "void UDB_show(UDB *self)",
                  "void UDB_showIndex(UDB *self)",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBInternal.h": [
                  "int UDB_isInTransaction(UDB *self);",
                  "UDBRecord *UDB_recordAtPid_(UDB *self, PID_TYPE pid);",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBRead.c": [
                  "UDBRecord *UDB_recordAtPid_(UDB *self, PID_TYPE pid)",
                  "Datum UDB_at_(UDB *self, PID_TYPE pid)",
                  "UDBRecord_pid(record) != pid",
                  "failed reading payload for PID",
              ],
              "trunk/user/skipdbv2/skipdbv2/udb/UDBWrite.c": [
                  "static int UDB_rollbackJournalAppend(JFile *file, long log_start,",
                  "static int UDB_append_withPid_(UDB *self, Datum d, PID_TYPE pid)",
                  "PID_TYPE UDB_put_(UDB *self, Datum d)",
                  "void UDB_at_put_(UDB *self, PID_TYPE pid, Datum d)",
                  "void UDB_removeAt_(UDB *self, PID_TYPE pid)",
                  "UDBIndex_isReservedPid_(self->index, pid)",
              ],
              "trunk/user/skipdbv2/skipdbv2/tests/commit_marker.c": [
                  "UDBCommitMarker_write(&marker,0)",
                  "UDBCommitMarker_write(&marker,1)",
                  "symlink followed",
                  "complete journal rejected",
                  "incomplete journal accepted",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/ipc_io.h": [
                  "static int skipdb_monotonic_milliseconds(",
                  "clock_gettime(CLOCK_MONOTONIC, &ts)",
                  "skipdb_monotonic_milliseconds(&now)",
                  "static int skipdb_wait_socket_until(int fd, short events,",
                  "poll(&pfd, 1, poll_timeout)",
                  "if (result < 0 && errno == EINTR)",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/dbus.c": [
                  "#include \"ipc_transport.h\"",
                  "skipdb_ipc_connect_unix(sock_path)",
                  "skipdb_ipc_set_nonblock(fd)",
                  "skipdb_ipc_ensure_buffer(&client->buf, &client->buf_max,",
                  "skipdb_ipc_valid_protocol_field(text, allow_empty,",
                  "skipdb_ipc_read_exact(client->remote_fd, client->buf, len,",
                  "skipdb_ipc_write_exact(client->remote_fd, client->buf, len, 20)",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/dbapi.c": [
                  "#include \"ipc_transport.h\"",
                  "skipdb_ipc_connect_unix(sock_path)",
                  "skipdb_ipc_set_nonblock(fd)",
                  "skipdb_ipc_ensure_buffer(&client->buf, &client->buf_max,",
                  "skipdb_ipc_valid_protocol_field(text, allow_empty, (size_t)-1)",
                  "skipdb_ipc_read_exact(client->remote_fd, client->buf, len,",
                  "skipdb_ipc_write_exact(client->remote_fd, client->buf, len, delay)",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/ipc_transport.h": [
                  "int skipdb_ipc_connect_unix(const char *sock_path);",
                  "int skipdb_ipc_read_exact(int fd, char *buffer, int length,",
                  "int skipdb_ipc_write_exact(int fd, const char *buffer, int length,",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/ipc_transport.c": [
                  "skipdb_monotonic_milliseconds(&now)",
                  "skipdb_wait_socket_until(fd, POLLIN, timeout)",
                  "skipdb_wait_socket_until(fd, POLLOUT, timeout)",
                  "MSG_NOSIGNAL",
                  "O_NONBLOCK",
              ],
              "trunk/user/skipdbv2/skipdbv2/tests/ipc_transport.c": [
                  "test_validation_and_buffer",
                  "test_unix_connect",
                  "test_nonblocking_and_write",
                  "test_read_success_eof_and_timeout",
              ],
              "trunk/user/skipdbv2/skipdbv2/CMakeLists.txt": [
                  "SET(JFILE_SRC",
                  "${PROJECT_SOURCE_DIR}/jfile/JFile.c",
                  "${PROJECT_SOURCE_DIR}/jfile/JFileJournal.c",
                  "${PROJECT_SOURCE_DIR}/jfile/JFileJournalScan.c",
                  "${PROJECT_SOURCE_DIR}/jfile/JFileSync.c",
                  "ADD_LIBRARY(skipdb STATIC ${BASEKIT_SRC} ${JFILE_SRC} ${UDB_SRC} ${SKIPDB_SRC})",
                  "jfile_journal_test",
                  "add_test(NAME jfile_journal_test COMMAND jfile_journal_test)",

                  "SET(UDB_SRC",
                  "UDBRead.c",
                  "UDBWrite.c",
                  "UDBStorage.c",
                  "UDBCompact.c",
                  "UDBRecordsStorage.c",
                  "UDBRecordsCursor.c",
                  "UDBRecordsFreeList.c",
                  "UDBIndexFreeList.c",
                  "UDBIndexMap.c",
                  "udb_index_layers_test",
                  "add_test(NAME udb_index_layers_test COMMAND udb_index_layers_test)",
                  "ADD_EXECUTABLE(udb_record_api_test",
                  "add_test(NAME udb_record_api_test COMMAND udb_record_api_test)",
                  "ADD_EXECUTABLE(commit_marker_test",
                  "add_test(NAME commit_marker_test COMMAND commit_marker_test)",
                  "ADD_EXECUTABLE(ipc_io_test",
                  "add_test(NAME ipc_io_test COMMAND ipc_io_test)",
                  "ADD_EXECUTABLE(ipc_transport_test",
                  "add_test(NAME ipc_transport_test COMMAND ipc_transport_test)",
                  "mgr/ipc_transport.c",
              ],
              "trunk/user/skipdbv2/skipdbv2/tests/ipc_io.c": [
                  "skipdb_wait_socket_until(sockets[0], POLLIN, now + 10ULL)",
                  "skipdb_wait_socket_until(sockets[0], POLLIN, now + 1000ULL)",
                  "skipdb_wait_socket_until(sockets[0], POLLOUT, now + 1000ULL)",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/skipd.c": [
                  "O_NOFOLLOW",
                  "st_nlink != 1",
                  "fchmod(fd, 0600)",
              ],
              "trunk/user/skipdbv2/skipdbv2/mgr/daemonize.c": [
                  "O_NOFOLLOW",
                  "st_nlink != 1",
                  "ftruncate(fd, 0)",
              ],
              "trunk/user/Makefile": [
                  "ifneq ($(filter y,$(CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS) $(CONFIG_FIRMWARE_INCLUDE_SKIPDBV2)),)",
                  "dir_y += skipdbv2",
              ],
              "trunk/libs/Makefile": [
                  "ifeq ($(CONFIG_FIRMWARE_INCLUDE_SKIPDBV2),y)",
                  "LIBS_INCLUDE_LIBEV=y",
              ],
              "trunk/user/rc/src/services.c": [
                  "#if defined(APP_SKIPDBV2)",
                  'doSystem("/usr/sbin/skipd -d /etc/storage/db");',
                  "#endif",
                  "start_gpio_btn();",
              ],
              "trunk/linux-4.4.x/arch/mips/boot/dts/ralink/xy-c1.dts": [
                  'compatible = "gpio-keys-polled";',
                  "gpios = <&gpio0 18 GPIO_ACTIVE_LOW>;",
                  "linux,code = <KEY_RESTART>;",
              ],
              "trunk/linux-4.4.x/drivers/gpio/Makefile": [
                  "obj-y += gpio-button-hotplug.o",
              ],
              "trunk/linux-4.4.x/drivers/gpio/gpio-button-hotplug.c": [
                  '"gpio-keys-polled"',
                  '"ACTION=%s"',
                  '"BUTTON=%s"',
              ],
              "trunk/configs/boards/XY-C1/kernel-4.4.x.config": [
                  "CONFIG_GPIOLIB=y",
                  "# CONFIG_INPUT is not set",
              ],
              "trunk/user/rc/src/gpio_btn.c": [
                  "NETLINK_KOBJECT_UEVENT",
                  'strcmp(value, "pressed")',
                  'strcmp(value, "released")',
                  'memcmp(field, "BUTTON",',
                  "static volatile sig_atomic_t running = 1;",
                  "memset(&btn_ev, 0, sizeof(btn_ev));\n\t\t\tnlmsg_handle(buf, msglen, &btn_ev);",
                  "CLOCK_MONOTONIC",
                  "btn_update_press_count(btn);",
                  "btn_hold_tick();",
              ],
          }

          build_workflow = Path(".github/workflows/build.yml").read_text()
          if re.search(r"(?m)^  watch:\s*$", build_workflow):
              raise SystemExit("release-capable Build Firmware workflow must not accept public watch events")
          if not re.search(r"(?m)^  workflow_dispatch:\s*$", build_workflow):
              raise SystemExit("Build Firmware must retain its authorized manual trigger")

          for path, needles in checks.items():
              content = Path(path).read_text()
              for needle in needles:
                  if needle not in content:
                      raise SystemExit(f"missing XY-C1 integration contract: {path}: {needle}")
              print(f"OK: {path}")

          user_makefile = Path("trunk/user/Makefile").read_text()
          if "dir_$(CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS)\t+= skipdbv2" in user_makefile:
              raise SystemExit("SkipDBv2 is still tied exclusively to Shadowsocks")

          for path in (
              "trunk/user/skipdbv2/skipdbv2/mgr/ipc_io.h",
              "trunk/user/skipdbv2/skipdbv2/mgr/dbus.c",
              "trunk/user/skipdbv2/skipdbv2/mgr/dbapi.c",
              "trunk/user/skipdbv2/skipdbv2/mgr/ipc_transport.c",
          ):
              content = Path(path).read_text()
              if "gettimeofday(&tv2, NULL)" in content:
                  raise SystemExit(f"wall-clock IPC timeout remains: {path}")
              if "usleep(5);" in content or "usleep(50);" in content:
                  raise SystemExit(f"busy-poll IPC retry remains: {path}")

          print("XY-C1 SkipDBv2 and GPIO hotplug integration contracts passed.")
          PY


      - name: Configure
        run: |
          cmake -S trunk/user/skipdbv2/skipdbv2 -B build/skipdbv2 \
            -DSKIPDB_BUILD_TESTS=ON

      - name: Build all SkipDBv2 targets
        run: cmake --build build/skipdbv2 --parallel 2

      - name: Run regression tests
        run: ctest --test-dir build/skipdbv2 --output-on-failure
