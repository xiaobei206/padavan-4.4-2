              "trunk/user/skipdbv2/skipdbv2/udb/UDBCommitMarker.c": [
                  "static int UDBCommitMarker_verifyOpenedFile_(int fd, const struct stat *before, int existed)",
                  "UDBCommitMarker_verifyOpenedFile_(fd, exists ? &before : NULL, exists)",
                  "UDBCommitMarker_verifyOpenedFile_(fd,&before,1)",
                  "O_NOFOLLOW",
                  "O_NONBLOCK|O_CLOEXEC",
                  "after.st_uid!=geteuid()",
                  "after.st_nlink!=1",
                  "fchmod(fd,0600)",
                  "JFile_verifyLog(&journal)",
                  "UDBCommitMarker_artifactsAreEmpty",
