          for module, needles in manager_contracts.items():
              content = (manager_root / module).read_text()
              for needle in needles:
                  if needle not in content:
                      raise SystemExit(f"skipd ownership contract missing: {module}: {needle}")

          command_source = (manager_root / "skipd_command.c").read_text()
          if command_source.count("SkipDB_beginTransaction(server->db);") != 1 or \
             command_source.count("SkipDB_at_put_(server->db, dkey, value)") != 1 or \
             command_source.count("SkipDB_exists(server->db, dkey)") != 1:
              raise SystemExit("delay/time task persistence is not centralized in one private helper")
          increment_start = command_source.find('} else if((!strcmp(client->command, "inc"))')
          increment_end = command_source.find("\n    }\n\n    ccrFinish(ctx, ccr_error_err2);", increment_start)
          increment_source = (
              command_source[increment_start:increment_end]
              if increment_start >= 0 and increment_end > increment_start
              else ""
          )
          read_result = increment_source.find("dvalue = SkipDB_at_(client->server->db, dkey);")
          database_state_check = increment_source.find("if (!SkipDB_isOpen(client->server->db))", read_result)
          missing_key_check = increment_source.find("if(NULL == dvalue.data)", read_result)
          if (
              not increment_source or read_result < 0 or database_state_check < 0 or
              missing_key_check < 0 or database_state_check > missing_key_check or
              "ccrReturn(ctx, ccr_error_ok1);" not in increment_source[database_state_check:missing_key_check]
          ):
              raise SystemExit("inc/desc must distinguish a failed database read from a missing key before defaulting to zero")

          if "static int client_run_command(" in (manager_root / "skipd.c").read_text():
              raise SystemExit("skipd command engine remains in the event-loop facade")
          if "int unix_socket_init(" in (manager_root / "skipd.c").read_text():
              raise SystemExit("skipd socket engine remains in the event-loop facade")

          skipd_facade_text = (manager_root / "skipd.c").read_text()
          for moved_script_symbol in (
              "static int open_script_log(",
              "int is_valid_script_name(",
              "int is_safe_script_command(",
              "void sys_script(",
              "script_log_fd",
          ):
              if moved_script_symbol in skipd_facade_text:
                  raise SystemExit("skipd script implementation remains in facade: " + moved_script_symbol)
          if skipd_facade_text.count("skipd_script_cleanup();") != 3:
              raise SystemExit("skipd script log descriptor is not closed on all daemon exit paths")

          for moved_client_symbol in (
              "static void client_release(",
              "static void client_read_inner(",
              "static void client_read(",
              "static void client_write(",
              "int client_send_key(",
              "int client_send(",
              "static int client_ccr_write(",
              "int client_ccr_read_util(",
              "static skipd_client* client_new(",
              "static void server_cb(",
          ):
              if moved_client_symbol in skipd_facade_text:
                  raise SystemExit("skipd client lifecycle remains in facade: " + moved_client_symbol)

          script_test = Path("trunk/user/skipdbv2/skipdbv2/tests/skipd_script.c").read_text()
          for needle in (
              "is_valid_script_name(",
              "is_safe_script_command(",
              "sys_script(",
              "scripts/../boot.sh",
              "scripts/boot.sh;reboot",
          ):
              if needle not in script_test:
                  raise SystemExit("skipd script safety regression missing: " + needle)
          if "add_test(NAME skipd_script_test COMMAND skipd_script_test)" not in cmake_text:
              raise SystemExit("skipd script safety regression is not registered")
          script_target_start = cmake_text.find("ADD_EXECUTABLE(skipd_script_test")
          script_target_end = cmake_text.find("add_test(", script_target_start)
          script_target = (
              cmake_text[script_target_start:script_target_end]
              if script_target_start >= 0 and script_target_end > script_target_start
              else ""
          )
          if (
              not script_target or
              "mgr/skipd_script.c" not in script_target or
              "TARGET_INCLUDE_DIRECTORIES(skipd_script_test PRIVATE ${PROJECT_SOURCE_DIR}/mgr)" not in script_target
          ):
              raise SystemExit("skipd script safety test must link the implementation and expose its private header")
          if cmake_text.count("mgr/skipd_script.c") != 2:
              raise SystemExit("skipd script module is not linked exactly once in production and once in its regression")

          if cmake_text.count("mgr/skipd_client.c") != 1:
              raise SystemExit("skipd client lifecycle module is not linked exactly once")
          skipd_client_source = (manager_root / "skipd_client.c").read_text()
          read_util_start = skipd_client_source.find("int client_ccr_read_util(")
          read_util_end = skipd_client_source.find("static skipd_client* client_new(", read_util_start)
          read_util_source = (
              skipd_client_source[read_util_start:read_util_end]
              if read_util_start >= 0 and read_util_end > read_util_start
              else ""
          )
          if (
              not read_util_source or
              read_util_source.count("ccrStop(ctx, ccr_error_err2);") != 2 or
              "ccrReturn(ctx, ccr_error_err2);" in read_util_source
          ):
              raise SystemExit("terminal client read errors must reset the read coroutine before returning")

          # Buffer growth must retain the old allocation if realloc fails.
          if (
              read_util_source.count("realloc(client->origin") != 1 or
              "free(client->origin);" in read_util_source or
              "client->origin_len = 0;" in read_util_source or
              "if (NULL == new_origin) {\n            ccrStop(ctx, ccr_error_err2);\n        }" not in read_util_source or
              read_util_source.find("client->origin = new_origin;") <
                  read_util_source.find("if (NULL == new_origin)")
          ):
              raise SystemExit("client read-buffer growth must preserve ownership on allocation failure")
          skipd_database_text = (manager_root / "skipd_database.c").read_text()
          if skipd_database_text.count("verify_owned_regular_file_(") != 3:
              raise SystemExit("database marker file validation must have one private owner and two callers")
          if skipd_database_text.find("static int verify_owned_regular_file_(") > skipd_database_text.find("static int read_db_switch_marker("):
              raise SystemExit("database marker validator must be declared before its first call")
          marker_write_start = skipd_database_text.find("static int write_db_switch_marker(")
          marker_write_end = skipd_database_text.find("static int server_open_database(", marker_write_start)
          marker_write_source = (
              skipd_database_text[marker_write_start:marker_write_end]
              if marker_write_start >= 0 and marker_write_end > marker_write_start
              else ""
          )
          if (
              not marker_write_source or
              "if (written == 0)\n            errno = EIO;" not in marker_write_source or
              "fail:\n    {\n        int saved_errno = errno;" not in marker_write_source or
              "errno = saved_errno;" not in marker_write_source
          ):
              raise SystemExit("database marker writes must report zero-byte I/O as EIO and preserve the primary error during cleanup")
          scheduler_source_text = (manager_root / "skipd_scheduler.c").read_text()
          if (
              "(int)(p1 - (char*)dvalue.data)" in scheduler_source_text or
              "tmpi = (unsigned char*)p1 - dvalue.data;" in scheduler_source_text
          ):
              raise SystemExit("scheduled value prefix length must not narrow before bounds checking")
          if scheduler_source_text.count("void server_init_delay(EV_P_ skipd_server *server)") != 1:
              raise SystemExit("scheduled delay startup parser must have exactly one function definition")
          jfile_source_text = Path("trunk/user/skipdbv2/skipdbv2/jfile/JFile.c").read_text()
          if jfile_source_text.count("JFile_verifyManagedFile_(") != 2:
              raise SystemExit("managed JFile descriptor validation must have one owner and one call")
          if jfile_source_text.find("static int JFile_verifyManagedFile_(") > jfile_source_text.find("FILE *JFile_openManagedFile_("):
              raise SystemExit("managed JFile validator must be declared before its caller")
          for module in ("skipd_command.c", "skipd_client.c", "skipd_database.c",
                         "skipd_scheduler.c", "skipd_socket.c", "skipd_script.c"):
              if f"mgr/{module}" not in cmake_text:
                  raise SystemExit(f"skipd module missing from executable source list: {module}")

          udb_record_core = Path("trunk/user/skipdbv2/skipdbv2/udb/UDBRecord.c").read_text()
          udb_record_write = Path("trunk/user/skipdbv2/skipdbv2/udb/UDBRecordWrite.c").read_text()
          if "int UDBRecord_isEmpty(" not in udb_record_core:
              raise SystemExit("UDBRecord emptiness predicate lost its metadata owner")
          if "UDBRecord_isEmpty(" in udb_record_write:
              raise SystemExit("UDBRecord emptiness predicate has multiple implementation owners")

          if cmake_text.count("mgr/ipc_protocol.c") < 5:
              raise SystemExit("IPC protocol parser is not linked by both CLIs and every protocol test")

          if cmake_text.count("mgr/dbus_result.c") != 2:
              raise SystemExit("DBus result module is not linked by the CLI and protocol regression")
          dbus_cli_text = (manager_root / "dbus.c").read_text()
          dbus_result_text = (manager_root / "dbus_result.c").read_text()
          if "int parse_script_result(dbclient *client)" in dbus_cli_text:
              raise SystemExit("DBus result parser remains in the CLI facade")
          if "int parse_script_result(dbclient *client)" not in dbus_result_text:
              raise SystemExit("DBus result module lost script-result ownership")

          if cmake_text.count("mgr/dbapi_result.c") != 2:
              raise SystemExit("DBAPI result module is not linked by the CLI and protocol regression")
          dbapi_cli_text = (manager_root / "dbapi.c").read_text()
          dbapi_result_text = (manager_root / "dbapi_result.c").read_text()
          if "static int parse_list_result(" in dbapi_cli_text:
              raise SystemExit("DBAPI list parser remains in the CLI facade")
          if "int dbapi_parse_list_result(" not in dbapi_result_text:
              raise SystemExit("DBAPI result module lost list-result ownership")
          if "static int ignore_result(" in dbapi_cli_text:
              raise SystemExit("DBAPI write-response parser remains in the CLI facade")

          if cmake_text.count("mgr/ipc_request.c") != 5:
              raise SystemExit("IPC request formatter is not linked by both CLIs, both protocol fixtures, and its unit test")
          if "add_test(NAME ipc_request_test COMMAND ipc_request_test)" not in cmake_text:
              raise SystemExit("IPC request-frame regression is not registered")
          for protocol_target in ("dbus_protocol_test", "dbapi_protocol_test"):
              target_start = cmake_text.find(f"ADD_EXECUTABLE({protocol_target}")
              target_end = cmake_text.find("add_test(", target_start)
              if target_start < 0 or target_end < 0 or \
                 "mgr/ipc_request.c" not in cmake_text[target_start:target_end]:
                  raise SystemExit(f"{protocol_target} is missing the shared IPC request formatter")
          request_header_text = (manager_root / "ipc_request.h").read_text()
          request_impl_text = (manager_root / "ipc_request.c").read_text()
          request_test_text = Path("trunk/user/skipdbv2/skipdbv2/tests/ipc_request.c").read_text()
          for request_source in (dbus_cli_text, dbapi_cli_text):
              if "skipdb_ipc_format_request(" not in request_source:
                  raise SystemExit("a CLI is not using the shared IPC request formatter")
              if "%s%07" in request_source:
                  raise SystemExit("a CLI still owns duplicate IPC request-header formatting")
          if "skipdb_ipc_finalize_request(" not in dbus_cli_text:
              raise SystemExit("DBus manual request assembly bypasses the shared finalizer")
          if "int skipdb_ipc_finalize_request(" not in request_header_text or \
             "int skipdb_ipc_format_request(" not in request_header_text:
              raise SystemExit("IPC request module declarations are incomplete")
          if "int skipdb_ipc_finalize_request(" not in request_impl_text or \
             "int skipdb_ipc_format_request(" not in request_impl_text:
              raise SystemExit("IPC request implementation ownership is incomplete")
          if "skipdb_ipc_format_request(" not in request_test_text:
              raise SystemExit("IPC request-frame regression cases are missing")

          print("XY-C1 SkipDBv2 and GPIO hotplug integration contracts passed.")
          PY


      - name: Configure
        run: |
          cmake -S trunk/user/skipdbv2/skipdbv2 -B build/skipdbv2 \
            -DSKIPDB_BUILD_TESTS=ON

      - name: Build all SkipDBv2 targets
        run: cmake --build build/skipdbv2 --parallel 2

      - name: Run regression tests
        run: ctest --test-dir build/skipdbv2 --output-on-failure
